<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>InsureOS — Insurance Business OS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
      :root {
        --bg: #f6f8fb;
        --c: #fff;
        --t: #0f172a;
        --m: #64748b;
        --l: #e2e8f0;
        --n: #0f1f3d;
        --b: #2456d6;
        --r: #dc2626;
        --a: #d97706;
        --g: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --c: #111a2e;
          --t: #e6ebf5;
          --m: #94a3b8;
          --l: #223152;
          --n: #070d1a;
          --b: #5b8cff;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font:
          13px/1.45 Inter,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--t);
        display: flex;
      }
      aside {
        width: 224px;
        background: var(--n);
        color: #cbd5e1;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        padding-top: env(safe-area-inset-top);
      }
      .logo {
        padding: 16px 18px;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .logo i {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--b);
        display: grid;
        place-items: center;
        font-style: normal;
      }
      nav {
        overflow: auto;
        flex: 1;
        padding: 4px 10px;
      }
      nav a {
        display: flex;
        justify-content: space-between;
        padding: 7px 10px;
        border-radius: 6px;
        color: #cbd5e1;
        text-decoration: none;
        cursor: pointer;
        margin: 1px 0;
      }
      nav a:hover {
        background: #ffffff14;
      }
      nav a.on {
        background: #ffffff22;
        color: #fff;
        font-weight: 600;
      }
      nav small {
        background: #ffffff22;
        border-radius: 9px;
        padding: 0 7px;
      }
      nav small.hot {
        background: var(--r);
        color: #fff;
      }
      .sec {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d8fb0;
        padding: 12px 10px 4px;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        height: 52px;
        background: var(--c);
        border-bottom: 1px solid var(--l);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        padding-top: env(safe-area-inset-top);
      }
      #menu {
        display: none;
      }
      .srch {
        flex: 1;
        max-width: 420px;
        text-align: left;
        color: var(--m);
        background: var(--bg);
        border: 1px solid var(--l);
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
        font: inherit;
      }
      .srch kbd {
        float: right;
        font-size: 10px;
        border: 1px solid var(--l);
        padding: 0 5px;
        border-radius: 4px;
      }
      #v {
        flex: 1;
        overflow: auto;
        padding: 20px 22px 40px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 2px;
        letter-spacing: -0.01em;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 13px;
      }
      .sub {
        color: var(--m);
        margin: 0 0 16px;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .bar .sp {
        flex: 1;
      }
      .card {
        background: var(--c);
        border: 1px solid var(--l);
        border-radius: 8px;
        padding: 14px;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .g4 {
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
      .g2 {
        grid-template-columns: 2fr 1fr;
      }
      .g3 {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .kpi b {
        display: block;
        font-size: 22px;
        margin-top: 2px;
      }
      .kpi span {
        color: var(--m);
        font-size: 12px;
      }
      .kpi.bad {
        border-left: 3px solid var(--r);
      }
      .kpi.warn {
        border-left: 3px solid var(--a);
      }
      .kpi.ok {
        border-left: 3px solid var(--g);
      }
      .kpi.info {
        border-left: 3px solid var(--b);
      }
      .kpi {
        cursor: pointer;
      }
      button,
      .btn {
        font: inherit;
        border: 1px solid var(--l);
        background: var(--c);
        color: var(--t);
        border-radius: 6px;
        padding: 6px 11px;
        cursor: pointer;
        font-weight: 500;
      }
      button:hover {
        border-color: var(--b);
      }
      button.p {
        background: var(--b);
        border-color: var(--b);
        color: #fff;
      }
      button.d {
        color: var(--r);
      }
      button.s {
        padding: 3px 8px;
        font-size: 12px;
      }
      input,
      select,
      textarea {
        font: inherit;
        border: 1px solid var(--l);
        border-radius: 6px;
        padding: 7px 9px;
        background: var(--c);
        color: var(--t);
        width: 100%;
      }
      .bar input,
      .bar select {
        width: auto;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--c);
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--m);
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--l);
        white-space: nowrap;
      }
      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--l);
        white-space: nowrap;
      }
      tr:hover td {
        background: color-mix(in srgb, var(--b) 5%, transparent);
      }
      td a,
      .lk {
        color: var(--b);
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
      }
      .r {
        text-align: right;
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        background: var(--l);
        color: var(--m);
      }
      .t-r {
        background: #fee2e2;
        color: #b91c1c;
      }
      .t-a {
        background: #fef3c7;
        color: #92400e;
      }
      .t-g {
        background: #d1fae5;
        color: #065f46;
      }
      .t-b {
        background: #dbeafe;
        color: #1e40af;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--l);
        margin: 14px 0;
        overflow-x: auto;
      }
      .tabs a {
        padding: 8px 13px;
        cursor: pointer;
        color: var(--m);
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tabs a.on {
        color: var(--b);
        border-color: var(--b);
        font-weight: 600;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(5, minmax(230px, 1fr));
        gap: 10px;
        overflow-x: auto;
      }
      .col {
        background: color-mix(in srgb, var(--l) 40%, transparent);
        border-radius: 8px;
        padding: 8px;
      }
      .col h4 {
        margin: 2px 4px 8px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      .rc {
        background: var(--c);
        border: 1px solid var(--l);
        border-radius: 6px;
        padding: 9px;
        margin-bottom: 8px;
      }
      .rc .a {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 7px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--l);
      }
      .row:last-child {
        border: 0;
      }
      .m {
        color: var(--m);
      }
      .empty {
        color: var(--m);
        text-align: center;
        padding: 22px;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #0f172a99;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 6vh 12px;
        z-index: 50;
        overflow: auto;
      }
      .md {
        background: var(--c);
        border-radius: 10px;
        padding: 18px;
        width: 100%;
        max-width: 520px;
      }
      .md h3 {
        font-size: 15px;
      }
      .fg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .fg label {
        font-size: 11px;
        color: var(--m);
        font-weight: 600;
        display: block;
      }
      .fg .w {
        grid-column: 1/-1;
      }
      #pal input {
        margin-bottom: 8px;
        font-size: 15px;
      }
      .hit {
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
      }
      .hit:hover,
      .hit.on {
        background: color-mix(in srgb, var(--b) 12%, transparent);
      }
      #toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--n);
        color: #fff;
        padding: 9px 16px;
        border-radius: 8px;
        z-index: 99;
        display: none;
      }
      #sbx {
        display: none;
        margin-left: auto;
        background: transparent;
        border: 0;
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1;
        padding: 4px 8px;
      }
      #sbk {
        display: none;
      }
      .es {
        text-align: center;
        max-width: 560px;
        margin: 20px auto;
        padding: 38px 24px;
      }
      .es .ic {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: var(--n);
        color: #fff;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        font-size: 20px;
      }
      .es h2 {
        margin: 0 0 6px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .es p {
        color: var(--m);
        margin: 0 0 18px;
        line-height: 1.55;
      }
      .cnt {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
        gap: 8px;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--l);
      }
      .cnt div {
        font-size: 11px;
        color: var(--m);
      }
      .cnt b {
        display: block;
        font-size: 18px;
        color: var(--t);
      }
      .hbar {
        height: 8px;
        background: var(--b);
        border-radius: 4px;
      }
      svg text {
        fill: var(--m);
        font-size: 10px;
      }
      @media (max-width: 860px) {
        aside {
          position: fixed;
          inset: 0 auto 0 0;
          z-index: 40;
          transform: translateX(-100%);
          transition: 0.2s;
        }
        aside.open {
          transform: none;
        }
        aside.open ~ #sbk {
          display: block;
          position: fixed;
          inset: 0;
          background: #0f172a99;
          z-index: 39;
        }
        #sbx {
          display: block;
        }
        #menu {
          display: inline-block;
        }
        .g2 {
          grid-template-columns: 1fr;
        }
        #v {
          padding: 14px 12px 40px;
        }
        .fg {
          grid-template-columns: 1fr;
        }
      }
          #gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
      #gate .gc{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:24px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(15,23,42,.12)}
      #gate h2{margin:0 0 8px}#gate input,#gate textarea{width:100%;margin:6px 0;box-sizing:border-box}
      .gerr{color:var(--r);font-size:13px;min-height:18px;margin:4px 0}
</style>
  </head>
  <body>
    <aside id="sb">
      <div class="logo">
        <i>◆</i>InsureOS<button
          id="sbx"
          aria-label="Close menu"
          onclick="sb.classList.remove('open')"
        >
          ✕
        </button>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div id="sbk" onclick="sb.classList.remove('open')"></div>
    <div class="main">
      <header>
        <button id="menu" onclick="sb.classList.toggle('open')">☰</button
        ><button class="srch" onclick="pal()">
          Search customers, policies, claims… <kbd>Ctrl K</kbd></button
        ><span style="flex: 1"></span><button class="p" onclick="quick()">+ New</button>
      </header>
      <div id="v"></div>
    </div>
    <div id="toast"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        T = new Date();
      T.setHours(0, 0, 0, 0);
      const iso = (d) =>
          new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10),
        ad = (n) => {
          const d = new Date(T);
          d.setDate(d.getDate() + n);
          return iso(d);
        },
        TD = iso(T);
      const dd = (s) => Math.round((new Date(s + "T00:00:00") - T) / 864e5),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const inr = (n) => "₹" + (+n || 0).toLocaleString("en-IN"),
        uid = (p) => p + Math.random().toString(36).slice(2, 8),
        fd = (s) =>
          s
            ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
              })
            : "—";
      let D,
        KEY = "insureos_v1";
      const blank = () => ({
        customers: [],
        policies: [],
        payments: [],
        claims: [],
        leads: [],
        tasks: [],
        docs: [],
        acts: [],
        set: { org: "", user: "", target: 0 },
      });
      function norm(x) {
        const b = blank();
        if (!x || typeof x != "object" || x.demo) return b;
        Object.keys(b).forEach((k) => {
          if (k != "set" && !Array.isArray(x[k])) x[k] = b[k];
        });
        const s = x.set || {};
        x.set = {
          org: s.org || "",
          user: s.user && s.user != "Admin" ? s.user : "",
          target: +s.target || 0,
        };
        delete x.demo;
        return x;
      }
      function legacy() {
        try {
          const x = JSON.parse(localStorage.getItem(KEY));
          return x && !x.demo ? norm(x) : null;
        } catch (e) { return null; }
      }
      function load() { D = blank(); }
      function save() {
        if (LOCAL) { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Browser storage full: ' + e.message); } }
        else sync();
      }
      const by = (a, id) => D[a].find((x) => x.id == id),
        cn = (id) => by("customers", id)?.name || "—",
        pn = (id) => by("policies", id)?.no || "—";
      function log(type, text, customerId, policyId) {
        D.acts.unshift({ id: uid("a"), at: Date.now(), type, text, customerId, policyId });
      }
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.style.display = "block";
        clearTimeout(toast.h);
        toast.h = setTimeout(() => (t.style.display = "none"), 2600);
      }
      const cls = (s) =>
          ({
            Overdue: "t-r",
            Rejected: "t-r",
            Lapsed: "t-r",
            Lost: "t-r",
            High: "t-r",
            "Docs Pending": "t-a",
            Pending: "t-a",
            Medium: "t-a",
            Quoted: "t-a",
            Intimated: "t-b",
            Open: "t-b",
            "Under Review": "t-b",
            New: "t-b",
            Settled: "t-g",
            Approved: "t-g",
            Received: "t-g",
            Won: "t-g",
            Done: "t-g",
            Active: "t-g",
          })[s] || "",
        tg = (s) => `<span class="tag ${cls(s)}">${esc(s)}</span>`;
      /* ---- entity config ---- */
      const cOpts = () => D.customers.map((c) => [c.id, c.name]),
        pOpts = () => D.policies.map((p) => [p.id, p.no + " · " + cn(p.customerId)]);
      const E = {
        customers: {
          t: "Customer",
          f: [
            ["name", "Full name", "text", 1],
            ["phone", "Mobile", "tel", 1],
            ["email", "Email", "email"],
            ["city", "City", "text"],
            ["dob", "Date of birth", "date"],
            ["notes", "Notes", "textarea"],
          ],
        },
        policies: {
          t: "Policy",
          f: [
            ["no", "Policy no.", "text", 1],
            ["customerId", "Customer", "select", 1, cOpts],
            ["insurer", "Insurer", "text", 1],
            ["type", "Type", "select", 1, ["Life", "Health", "Motor", "General"]],
            ["plan", "Plan", "text"],
            ["sum", "Sum assured (₹)", "number"],
            ["premium", "Premium (₹)", "number", 1],
            ["mode", "Mode", "select", 0, ["Yearly", "Half-yearly", "Quarterly", "Monthly"]],
            ["start", "Start date", "date"],
            ["due", "Next due date", "date", 1],
            ["status", "Status", "select", 0, ["Active", "Lapsed", "Matured"]],
          ],
        },
        payments: {
          t: "Payment",
          f: [
            ["customerId", "Customer", "select", 1, cOpts],
            ["policyId", "Policy", "select", 1, pOpts],
            ["amount", "Amount (₹)", "number", 1],
            ["date", "Date", "date", 1],
            ["mode", "Mode", "select", 0, ["UPI", "Cheque", "Cash", "Online"]],
            ["status", "Status", "select", 0, ["Received", "Pending"]],
            ["receipt", "Receipt no.", "text"],
          ],
        },
        claims: {
          t: "Claim",
          f: [
            ["customerId", "Customer", "select", 1, cOpts],
            ["policyId", "Policy", "select", 1, pOpts],
            ["type", "Claim type", "text", 1],
            ["amount", "Amount (₹)", "number"],
            ["date", "Date", "date", 1],
            [
              "status",
              "Status",
              "select",
              0,
              ["Intimated", "Docs Pending", "Under Review", "Approved", "Settled", "Rejected"],
            ],
            ["notes", "Notes", "textarea"],
          ],
        },
        leads: {
          t: "Lead",
          f: [
            ["name", "Name", "text", 1],
            ["phone", "Mobile", "tel", 1],
            ["interest", "Interest", "text"],
            ["source", "Source", "select", 0, ["Referral", "Website", "Walk-in", "Camp", "Social"]],
            ["stage", "Stage", "select", 0, ["New", "Contacted", "Quoted", "Won", "Lost"]],
            ["value", "Est. premium (₹)", "number"],
            ["next", "Next follow-up", "date"],
          ],
        },
        tasks: {
          t: "Task",
          f: [
            ["title", "Task", "text", 1],
            ["customerId", "Customer", "select", 0, cOpts],
            ["due", "Due date", "date", 1],
            ["priority", "Priority", "select", 0, ["High", "Medium", "Low"]],
            ["status", "Status", "select", 0, ["Open", "Done"]],
          ],
        },
        docs: {
          t: "Document",
          f: [
            ["name", "File name", "text", 0],
            [
              "type",
              "Type",
              "select",
              0,
              [
                "Aadhaar",
                "PAN",
                "Policy Bond",
                "Premium Receipt",
                "Claim Form",
                "Discharge Summary",
                "Bank Proof",
                "Photo",
                "Other",
              ],
            ],
            ["customerId", "Customer", "select", 1, cOpts],
            ["policyId", "Policy", "select", 0, pOpts],
            ["claimId", "Claim", "select", 0, () => D.claims.map((c) => [c.id, c.type + " · " + cn(c.customerId)])],
            ["size", "Size", "text"],
          ],
        },
      };
      const DEF = {
        customers: {},
        policies: { mode: "Yearly", status: "Active", type: "Life" },
        payments: { date: TD, mode: "UPI", status: "Received" },
        claims: { date: TD, status: "Intimated" },
        leads: { stage: "New", source: "Referral", next: ad(2) },
        tasks: { due: TD, priority: "Medium", status: "Open" },
        docs: { type: "Other" },
      };
      function modal(html) {
        closeM();
        const o = document.createElement("div");
        o.className = "ov";
        o.id = "ov";
        o.innerHTML = '<div class="md">' + html + "</div>";
        o.onclick = (e) => {
          if (e.target == o) closeM();
        };
        document.body.appendChild(o);
      }
      function closeM() {
        $("#ov")?.remove();
      }
      function openForm(ent, id, pre = {}) {
        if (!id) {
          const n = need(ent);
          if (n) {

                i >= 0 ? (D[k][i] = r) : D[k].push(r);
              }
              ch = true;
            });
            if (ch) D[k].sort((a, b) => (k == "acts" ? b.at - a.at : (a._c || 0) - (b._c || 0)));
            if (first) { first = false; done(); } else if (ch && ready) { clearTimeout(rT); rT = setTimeout(render, 150); }
          }, (e) => loginGate("Cloud error: " + e.message + " (check Firestore rules)")));
        });
        let f2 = true;
        unsubs.push(root.collection("meta").doc("settings").onSnapshot((s) => {
          if (s.exists && !s.metadata.hasPendingWrites) {
            const v = s.data();
            D.set = { org: v.org || "", user: v.user || "", target: +v.target || 0 };
            SNAP.set = JSON.stringify(D.set);
            if (!f2 && ready) render();
          }
          if (f2) { f2 = false; done(); }
        }));
      }
      function boot() {
        load();
        if (localStorage.getItem("insureos_local") == "1") return startLocal();
        const c = fbcfg();
        if (!window.firebase) return gate('<p class="m">Could not load cloud sync. Check your connection, or continue offline.</p>' + OFF);
        try {
          firebase.initializeApp(c);
          FAUTH = firebase.auth();
          FDB = firebase.firestore();
        } catch (e) { return gate('<p class="m">Firebase error: ' + esc(e.message) + "</p>" + OFF); }
        gate('<p class="m">Loading…</p>');
        FAUTH.onAuthStateChanged((u) => {
          unsubs.forEach((f) => f()); unsubs = [];
          ready = false; SNAP = {}; D = blank(); FBU = u;
          u ? (gate('<p class="m">Loading your data…</p>'), listen()) : loginGate();
        });
      }
      boot();
    </script>
  </body>
</html>
