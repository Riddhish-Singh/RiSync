                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
                dragState = {};
            }

            // --- RESIZE FUNCTIONS ---

            function onResizeStart(e, handle, targetElement, elementData) {
                e.preventDefault();
                e.stopPropagation();

                const slideRect = preview.slideContainer.getBoundingClientRect();
                
                resizeState = {
                    handle, targetElement, elementData, slideRect,
                    startX: e.clientX,
                    startY: e.clientY,
                    startWidthPercent: elementData.width,
                    startHeightPercent: elementData.height,
                    isText: elementData.type === 'text',
                };
                
                document.addEventListener('mousemove', onResizeMove);
                document.addEventListener('mouseup', onResizeEnd);
            }

            function onResizeMove(e) {
                if (!resizeState.targetElement) return;

                const dx = e.clientX - resizeState.startX;
                const dy = e.clientY - resizeState.startY;
                const dxPercent = (dx / resizeState.slideRect.width) * 100;
                const dyPercent = (dy / resizeState.slideRect.height) * 100;

                let newWidthPercent = resizeState.startWidthPercent + dxPercent;
                newWidthPercent = Math.max(5, Math.min(newWidthPercent, 100 - resizeState.elementData.x));
                
                resizeState.elementData.width = newWidthPercent;
                resizeState.targetElement.style.width = `${newWidthPercent}%`;

                if (!resizeState.isText) {
                    let newHeightPercent = resizeState.startHeightPercent + dyPercent;
                    newHeightPercent = Math.max(5, Math.min(newHeightPercent, 100 - resizeState.elementData.y));
                    resizeState.elementData.height = newHeightPercent;
                    resizeState.targetElement.style.height = `${newHeightPercent}%`;
                }
            }

            function onResizeEnd() {
                document.removeEventListener('mousemove', onResizeMove);
                document.removeEventListener('mouseup', onResizeEnd);
                resizeState = {};
            }

            // --- INLINE EDIT FUNCTION ---

            function onDoubleClick(e) {
                if (slides[currentSlideIndex].template !== 'canvas') return;
                const targetElement = e.target.closest('.canvas-element');
                if (!targetElement) return;

                const elementId = targetElement.dataset.elementId;
                const el = slides[currentSlideIndex].elements.find(e => e.id === elementId);

                if (el && el.type === 'text') {
                    editingTextElementId = el.id;
                    selectedElementId = el.id;
                    renderCurrentSlide();
                    renderEditor();
                }
            }
            
            // --- PROJECT I/O FUNCTIONS ---
            
            function saveProject() {
                const projectData = {
                    globalSettings: globalSettings,
                    slides: slides
                };
                const dataStr = JSON.stringify(projectData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'presentation.rs'; // Save with .rs extension
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showProjectMessage("Project saved as presentation.rs!");
            }

            function loadProject(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const projectData = JSON.parse(event.target.result);
                        if (projectData && projectData.globalSettings && projectData.slides) {
                            
                            // Merge loaded settings with defaults to ensure new properties exist
                            const defaultSettings = {
                                backgroundPattern: 'pattern-none',
                                backgroundType: 'bg-solid',
                                customColors: globalSettings.customColors
                            };
                            
                            globalSettings = { ...defaultSettings, ...projectData.globalSettings };
                            slides = projectData.slides;
                            currentSlideIndex = 0;
                            
                            // Ensure new settings exist
                            globalSettings.customColors = { ...defaultSettings.customColors, ...globalSettings.customColors };

                            
                            // Restore UI from loaded settings
                            controls.headerInput.value = globalSettings.header;
                            controls.logoInput.value = globalSettings.logoUrl;
                            controls.footerInput.value = globalSettings.footer;
                            controls.animationSelect.value = globalSettings.animation;
                            controls.fontSelect.value = globalSettings.font;
                            controls.themeSelect.value = globalSettings.theme;
                            controls.customThemeSettings.classList.toggle('hidden', globalSettings.theme !== 'theme-custom');
                            
                            // Restore Custom Theme UI
                            const customThemeInputs = [
                                { el: controls.customTitleBg, prop: '--custom-title-bg' },
                                { el: controls.customTitleText, prop: '--custom-title-text' },
                                { el: controls.customContentBg, prop: '--custom-content-bg' },
                                { el: controls.customContentBg2, prop: '--custom-content-bg-2' },
                                { el: controls.customContentHeading, prop: '--custom-content-heading' },
                                { el: controls.customContentText, prop: '--custom-content-text' },
                                { el: controls.customImageBg, prop: '--custom-image-bg' },
                                { el: controls.customHeaderText, prop: '--custom-header-text' },
                                { el: controls.customPatternColor, prop: '--custom-pattern-color' },
                            ];
                            
                            customThemeInputs.forEach(item => {
                                if (globalSettings.customColors[item.prop]) {
                                    item.el.value = globalSettings.customColors[item.prop];
                                }
                            });
                            
                            controls.customBgPattern.value = globalSettings.backgroundPattern;
                            controls.customBgType.value = globalSettings.backgroundType; // NEW

                            // Apply loaded custom theme
                            if (globalSettings.theme === 'theme-custom') {
                                applyCustomThemeColors();
                                updateBackgroundPattern();
                                updateBackgroundType(); // NEW
                            }

                            renderApp();
                            showProjectMessage("Project loaded successfully!");
                        } else {
                            throw new Error('Invalid project file format.');
                        }
                    } catch (err) {
                        console.error("Failed to load project:", err);
                        showProjectMessage("Error: Could not load file. Invalid format.", true);
                    }
                };
                reader.readAsText(file);
                
                // Clear the input to allow loading the same file again
                e.target.value = null;
            }
            
            function showProjectMessage(message, isError = false) {
                controls.projectMessage.textContent = message;
                controls.projectMessage.className = isError ? 'text-red-400 text-xs mt-2 min-h-[1em]' : 'text-green-400 text-xs mt-2 min-h-[1em]';
                setTimeout(() => {
                    controls.projectMessage.textContent = '';
                }, 3000);
            }

            // --- PRESENTATION MODE FUNCTIONS ---
            
            function startPresentation() {
                if (slides.length === 0) return;
                
                isPresenting = true;
                presentation.overlay.classList.add('visible');
                
                // Ensure custom styles are applied before rendering
                if (globalSettings.theme === 'theme-custom') {
                    applyCustomThemeColors();
                    updateBackgroundPattern();
                    updateBackgroundType(); // NEW
                }
                
                try {
                    // Try to enter fullscreen
                    document.documentElement.requestFullscreen();
                } catch (err) {
                    console.warn("Could not enter fullscreen:", err);
                }
                
                renderPresentationSlide(); // Render the first slide
            }
            
            function stopPresentation() {
                isPresenting = false;
                presentation.overlay.classList.remove('visible');
                
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                }
                
                // Clear presentation slide container
                presentation.slideContainer.innerHTML = '';
                
                // Re-render editor view
                renderApp();
            }

            function sanitize(str) {
                if (!str) return '';
                return str.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/&lt;br&GgTt;/g, '<br>');
            }
            
            // --- START THE APP ---
            init();
        });
    </script>
</body>
</html>
