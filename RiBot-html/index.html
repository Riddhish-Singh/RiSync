<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book A Demo</title>
    <style>
        /* CSS Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            /* Full screen background setup */
            background-image: url('RiBot-html.png'); 
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            
            /* Center the content */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Optional: Add a dark overlay so the button pops */
            background-color: rgba(0, 0, 0, 0.3);
            background-blend-mode: overlay;
        }

        .connect-btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #0077b5; /* LinkedIn Blue */
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 181, 0.4);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .connect-btn:hover {
            background-color: #005582;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 181, 0.6);
        }

        .connect-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="linkedinBtn" class="connect-btn">Book A Demo</button>
    </div>

    <script>
        // JavaScript Logic
        document.addEventListener('DOMContentLoaded', function() {
            const button = document.getElementById('linkedinBtn');
            const linkedInUrl = "https://in.linkedin.com/in/riddhish-singh-075324368";

            button.addEventListener('click', function() {
                // Open the link in a new tab
                window.open(linkedInUrl, '_blank');
            });
        });
    </script>
</body>
</html>
