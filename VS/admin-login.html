<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Vigyanshaala Idea Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' },
                        ocean: { 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        fresh: { 400: '#a3e635', 500: '#84cc16', 600: '#65a30d' },
                        spark: { 400: '#facc15', 500: '#eab308' }
                    }
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(19, 78, 74, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0d9488;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <div class="absolute top-0 left-1/4 w-96 h-96 bg-brand-200/50 dark:bg-brand-900/20 rounded-full blur-3xl -z-10 mix-blend-multiply dark:mix-blend-screen animate-pulse"></div>
    <div class="absolute bottom-10 right-1/4 w-72 h-72 bg-fresh-400/30 dark:bg-fresh-900/10 rounded-full blur-3xl -z-10 mix-blend-multiply dark:mix-blend-screen"></div>

    <button id="themeToggle" class="absolute top-6 right-6 p-2 rounded-full hover:bg-brand-50 dark:hover:bg-brand-900/30 transition text-brand-600 dark:text-brand-300">
        <i class="fas fa-moon dark:hidden"></i>
        <i class="fas fa-sun hidden dark:block text-spark-400"></i>
    </button>

    <main class="w-full max-w-md px-6">
        
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 mb-4 hover:opacity-80 transition">
                <img src="https://vigyanshaala.com/wp-content/uploads/2021/06/VS-logo.png" alt="Logo" class="h-12 w-auto rounded-md">
            </a>
            <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Admin Portal</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Restricted access for authorized personnel only.</p>
        </div>

        <div class="glass-panel p-8 rounded-2xl shadow-xl shadow-brand-900/10 border-t-4 border-t-brand-500">
            
            <form id="adminLoginForm" class="space-y-6">
                
                <div>
                    <label for="email" class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-slate-400"></i>
                        </div>
                        <input type="email" id="email" required 
                            class="block w-full pl-10 pr-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition placeholder-slate-400 dark:text-white" 
                            placeholder="admin@vigyanshaala.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="password" required 
                            class="block w-full pl-10 pr-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition placeholder-slate-400 dark:text-white" 
                            placeholder="••••••••">
                    </div>
                </div>

                <div id="errorMessage" class="hidden p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/50 rounded-lg flex items-center gap-3 text-red-600 dark:text-red-400 text-xs font-medium">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorText">Invalid credentials.</span>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-brand-600 to-ocean-600 hover:from-brand-700 hover:to-ocean-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-brand-500/20 transform transition hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 flex justify-center items-center gap-2">
                    <span id="btnText">Secure Login</span>
                    <div id="btnLoader" class="loader hidden border-white border-t-transparent"></div>
                </button>

            </form>

            <div class="mt-6 text-center">
                <a href="index.html" class="text-xs font-medium text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 transition flex items-center justify-center gap-1">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>

        </div>
    </main>

    <footer class="absolute bottom-4 w-full text-center">
        <p class="text-[10px] text-slate-400 dark:text-slate-600 uppercase tracking-widest font-bold">Vigyanshaala Internal System</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

        // Your Exact Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGpwRwsJfD8QlCHOnXPxxLyGb34ezokgQ",
            authDomain: "vs-idea-labs.firebaseapp.com",
            projectId: "vs-idea-labs",
            storageBucket: "vs-idea-labs.firebasestorage.app",
            messagingSenderId: "789407499622",
            appId: "1:789407499622:web:18758c729f4b283ddcf4a7",
            measurementId: "G-XKFLFPDZLP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- Logic ---
        const loginForm = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // The ONLY allowed admin email
        const ADMIN_EMAIL = "hr@vigyanshaala.com";

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            setLoading(true);
            hideError();

            const email = emailInput.value.trim();
            const password = passInput.value;

            // 1. Check Email Restriction locally first
            if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                showError("Access Denied: You are not authorized as an Administrator.");
                setLoading(false);
                return;
            }

            try {
                // 2. Firebase Authentication
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Double Check (Security)
                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    // Success! Redirect to Dashboard (or Admin Dashboard)
                    // For now, we redirect to admin-leaderboard.html, assuming you'll add admin features there
                    window.location.href = "admin-leaderboard.html?role=admin"; 
                } else {
                    // If somehow they logged in but aren't the right email (redundant but safe)
                    await signOut(auth);
                    showError("Unauthorized account.");
                }

            } catch (error) {
                console.error("Login Error:", error);
                let msg = "Login failed. Please check your credentials.";
                if (error.code === 'auth/wrong-password') msg = "Incorrect password.";
                if (error.code === 'auth/user-not-found') msg = "Admin account not found.";
                if (error.code === 'auth/too-many-requests') msg = "Too many failed attempts. Try again later.";
                showError(msg);
            } finally {
                setLoading(false);
            }
        });

        // --- Helper Functions ---
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                btnText.textContent = "Verifying...";
                btnLoader.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = "Secure Login";
                btnLoader.classList.add('hidden');
            }
        }

        function showError(msg) {
            errorMessage.classList.remove('hidden');
            errorText.textContent = msg;
            // Shake animation
            errorMessage.classList.add('animate-pulse');
            setTimeout(() => errorMessage.classList.remove('animate-pulse'), 500);
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // --- Theme Logic (Matches Index) ---
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });
    </script>
</body>
</html>
