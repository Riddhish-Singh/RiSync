<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ideas | Vigyanshaala Idea Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' },
                        ocean: { 500: '#0ea5e9', 600: '#0284c7' },
                        fresh: { 400: '#a3e635', 500: '#84cc16' },
                        spark: { 400: '#facc15' }
                    }
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .nav-item.active { background: #f0fdfa; color: #0d9488; border-right: 3px solid #0d9488; }
        .dark .nav-item.active { background: rgba(13, 148, 136, 0.1); color: #2dd4bf; border-right: 3px solid #2dd4bf; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #0d9488; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Progress Bar Animation */
        .progress-fill { transition: width 1.5s ease-in-out; width: 0%; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 hidden md:flex flex-col z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-100 dark:border-slate-800">
            <span class="font-bold text-lg tracking-tight text-brand-600 dark:text-brand-400">Vigyanshaala</span>
        </div>
        <nav class="flex-1 py-6 space-y-1">
            <a href="index.html" class="nav-item flex items-center px-6 py-3 text-slate-500 hover:text-brand-600 transition">
                <i class="fas fa-home w-6"></i> <span class="font-medium text-sm">Home</span>
            </a>
            <a href="dashboard.html" class="nav-item flex items-center px-6 py-3 text-slate-500 hover:text-brand-600 transition">
                <i class="fas fa-chart-pie w-6"></i> <span class="font-medium text-sm">Dashboard</span>
            </a>
            <a href="leaderboard.html" class="nav-item active flex items-center px-6 py-3 text-brand-600 dark:text-brand-400">
                <i class="fas fa-medal w-6"></i> <span class="font-medium text-sm">Leaderboard</span>
            </a>
            <a href="#" class="nav-item active flex items-center px-6 py-3">
                <i class="fas fa-folder-open w-6"></i> <span class="font-medium text-sm">My Ideas</span>
            </a>
            <a href="submit.html" class="nav-item flex items-center px-6 py-3 text-slate-500 hover:text-brand-600 transition">
                <i class="fas fa-plus-circle w-6"></i> <span class="font-medium text-sm">New Idea</span>
            </a>
            <a href="challenges.html" class="nav-item flex items-center px-6 py-3 text-slate-500 hover:text-brand-600 transition">
                <i class="fas fa-trophy w-6"></i> <span class="font-medium text-sm">Challenges</span>
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        
        <header class="h-16 glass-panel border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 z-10">
            <h1 class="text-xl font-bold">My Innovation Portfolio</h1>
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300">
                    <i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:block"></i>
                </button>
                <div class="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-700">
                    <span id="userName" class="text-sm font-bold hidden sm:block">Loading...</span>
                    <img id="userAvatar" src="https://ui-avatars.com/api/?name=User" class="w-9 h-9 rounded-full bg-slate-200">
                    <button id="logoutBtn" class="text-slate-400 hover:text-red-500 ml-2"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50 dark:bg-slate-900">
            
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                    <div class="relative w-full sm:w-64">
                        <i class="fas fa-search absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input type="text" placeholder="Search my ideas..." class="w-full pl-9 pr-4 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div class="flex gap-2">
                        <button class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-bold text-brand-600 dark:text-brand-400 shadow-sm">All</button>
                        <button class="px-4 py-2 bg-transparent border border-transparent hover:bg-white dark:hover:bg-slate-800 rounded-lg text-xs font-medium text-slate-500">Approved</button>
                        <button class="px-4 py-2 bg-transparent border border-transparent hover:bg-white dark:hover:bg-slate-800 rounded-lg text-xs font-medium text-slate-500">Drafts</button>
                    </div>
                </div>

                <div id="ideasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="col-span-full flex flex-col items-center justify-center py-20">
                        <div class="loader mb-4"></div>
                        <p class="text-slate-500 text-sm">Fetching your innovations...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGpwRwsJfD8QlCHOnXPxxLyGb34ezokgQ",
            authDomain: "vs-idea-labs.firebaseapp.com",
            projectId: "vs-idea-labs",
            storageBucket: "vs-idea-labs.firebasestorage.app",
            messagingSenderId: "789407499622",
            appId: "1:789407499622:web:18758c729f4b283ddcf4a7",
            measurementId: "G-XKFLFPDZLP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ideasGrid = document.getElementById('ideasGrid');
        
        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userName').textContent = user.displayName || 'Innovator';
                if(user.photoURL) document.getElementById('userAvatar').src = user.photoURL;
                fetchUserIdeas(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });

        // Fetch Data
        async function fetchUserIdeas(uid) {
            try {
                // Query: ideas where userId == loggedInUid
                const q = query(collection(db, "ideas"), where("userId", "==", uid));
                
                const querySnapshot = await getDocs(q);
                ideasGrid.innerHTML = ""; // Clear loader

                if (querySnapshot.empty) {
                    renderEmptyState();
                    return;
                }

                querySnapshot.forEach((doc) => {
                    renderIdeaCard(doc.data(), doc.id);
                });
                
                // Trigger Progress Bar Animations
                setTimeout(() => {
                    document.querySelectorAll('.progress-fill').forEach(bar => {
                        bar.style.width = bar.getAttribute('data-width');
                    });
                }, 100);

            } catch (error) {
                console.error("Error:", error);
                ideasGrid.innerHTML = `<div class="col-span-full text-center text-red-500">Error loading ideas.</div>`;
            }
        }

        function renderIdeaCard(data, id) {
            // 1. Calculate Progress based on Milestone
            const milestones = {
                'Concept Validation': 25,
                'Prototyping': 50,
                'Testing': 75,
                'Completed': 100
            };
            const progress = milestones[data.milestone] || 10;
            
            // 2. Status Badge Styling
            const statusConfig = {
                'Submitted': { bg: 'bg-slate-100', text: 'text-slate-600', icon: 'fa-paper-plane' },
                'Approved': { bg: 'bg-brand-100', text: 'text-brand-700', icon: 'fa-check' },
                'In Progress': { bg: 'bg-ocean-100', text: 'text-ocean-700', icon: 'fa-tools' },
                'Rejected': { bg: 'bg-red-100', text: 'text-red-700', icon: 'fa-times' }
            };
            const status = data.status || 'Submitted';
            const sStyle = statusConfig[status] || statusConfig['Submitted'];

            // 3. Score Styling
            const score = data.score || 0;
            let scoreColor = 'text-slate-400';
            if(score > 80) scoreColor = 'text-green-500';
            else if(score > 50) scoreColor = 'text-yellow-500';

            // 4. HTML Template
            const card = `
                <div class="glass-panel rounded-2xl p-6 hover:shadow-lg transition duration-300 relative group flex flex-col h-full border border-white/50 dark:border-slate-700/50">
                    
                    <div class="flex justify-between items-start mb-4">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${sStyle.bg} ${sStyle.text}">
                            <i class="fas ${sStyle.icon}"></i> ${status}
                        </span>
                        <span class="text-xs text-slate-400 font-medium bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">
                            ${data.category || 'General'}
                        </span>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 dark:text-white mb-2 line-clamp-2 leading-tight">
                        ${data.title || 'Untitled Innovation'}
                    </h3>
                    
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 line-clamp-3 flex-grow">
                        ${data.problem || 'No description provided.'}
                    </p>

                    <div class="grid grid-cols-2 gap-4 mb-4 pt-4 border-t border-slate-100 dark:border-slate-700/50">
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Milestone</p>
                            <p class="text-sm font-semibold text-brand-600 dark:text-brand-400 truncate">${data.milestone || 'Concept'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Impact Score</p>
                            <p class="text-xl font-extrabold ${scoreColor}">${score}<span class="text-xs text-slate-300">/100</span></p>
                        </div>
                    </div>

                    <div class="relative pt-1">
                        <div class="flex mb-2 items-center justify-between">
                            <span class="text-xs font-semibold inline-block text-brand-600 dark:text-brand-400">Progress</span>
                            <span class="text-xs font-semibold inline-block text-brand-600 dark:text-brand-400">${progress}%</span>
                        </div>
                        <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-brand-100 dark:bg-slate-700">
                            <div data-width="${progress}%" class="progress-fill shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-brand-500"></div>
                        </div>
                    </div>

                    <button class="w-full mt-auto bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-2 rounded-lg text-sm border border-slate-200 dark:border-slate-700 transition">
                        View Details
                    </button>
                </div>
            `;
            ideasGrid.innerHTML += card;
        }

        function renderEmptyState() {
            ideasGrid.innerHTML = `
                <div class="col-span-full py-16 text-center border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl bg-white/50 dark:bg-slate-800/30">
                    <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-lightbulb text-4xl text-slate-300"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200 mb-2">No Ideas Yet</h3>
                    <p class="text-slate-500 max-w-sm mx-auto mb-6">Your portfolio is empty. Start your journey by submitting your first problem statement.</p>
                    <a href="submit.html" class="inline-flex items-center gap-2 bg-brand-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-brand-700 transition shadow-lg shadow-brand-500/30">
                        <i class="fas fa-plus"></i> Submit Idea
                    </a>
                </div>
            `;
        }
    </script>

    <script>
        const themeBtn = document.getElementById('themeToggle');
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }
        themeBtn.onclick = () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        };
    </script>
</body>
</html>
