<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Vigyanshaala</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' },
                        ocean: { 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        fresh: { 400: '#a3e635', 500: '#84cc16', 600: '#65a30d' },
                    }
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 glass-panel border-b border-brand-100 dark:border-brand-900/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg tracking-tight block leading-tight">Admin Console</span>
                        <span class="text-[10px] uppercase font-bold text-brand-600 dark:text-brand-400 tracking-wider">Vigyanshaala Idea Lab</span>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i class="fas fa-moon dark:hidden text-slate-500"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                    <div class="h-8 w-[1px] bg-slate-200 dark:bg-slate-700"></div>
                    <span id="adminEmail" class="text-xs font-mono text-slate-500 hidden sm:block">Loading...</span>
                    <button id="logoutBtn" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-md font-bold transition">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <div class="lg:col-span-8 space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-inbox text-brand-500"></i> Pending Reviews
                </h2>
                <button onclick="fetchIdeas()" class="text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1 rounded-md hover:bg-slate-50 transition">
                    <i class="fas fa-sync-alt mr-1"></i> Refresh
                </button>
            </div>

            <div id="ideasFeed" class="space-y-4">
                <div class="glass-panel p-12 text-center rounded-xl animate-pulse">
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3 mx-auto mb-4"></div>
                    <div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2 mx-auto"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-6">
            <div class="glass-panel rounded-xl p-5 border-t-4 border-t-ocean-500 sticky top-24">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-trophy text-yellow-400"></i> Live Rankings
                </h2>
                
                <div class="relative mb-4">
                    <i class="fas fa-search absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="userSearch" placeholder="Search student..." 
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg py-2 pl-8 pr-3 text-sm focus:ring-2 focus:ring-brand-500 outline-none transition">
                </div>

                <div id="adminLeaderboard" class="space-y-2 max-h-[600px] overflow-y-auto pr-1">
                    <div class="text-center text-xs text-slate-400 py-4">Loading users...</div>
                </div>
            </div>
        </div>

    </main>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGpwRwsJfD8QlCHOnXPxxLyGb34ezokgQ",
            authDomain: "vs-idea-labs.firebaseapp.com",
            projectId: "vs-idea-labs",
            storageBucket: "vs-idea-labs.firebasestorage.app",
            messagingSenderId: "789407499622",
            appId: "1:789407499622:web:18758c729f4b283ddcf4a7",
            measurementId: "G-XKFLFPDZLP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const ideasFeed = document.getElementById('ideasFeed');
        const adminLeaderboard = document.getElementById('adminLeaderboard');
        const adminEmailDisplay = document.getElementById('adminEmail');
        
        // --- Auth Check ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if(user.email !== "hr@vigyanshaala.com") {
                    alert("Unauthorized Access");
                    window.location.href = "index.html";
                }
                adminEmailDisplay.textContent = user.email;
                fetchIdeas();
                fetchUsers();
            } else {
                window.location.href = "admin-login.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "admin-login.html");
        });

        // --- 1. Fetch & Render Ideas ---
        window.fetchIdeas = async function() {
            ideasFeed.innerHTML = '<div class="text-center py-10"><div class="loader inline-block"></div></div>';
            
            try {
                const q = query(collection(db, "ideas"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                ideasFeed.innerHTML = "";

                if (querySnapshot.empty) {
                    ideasFeed.innerHTML = `<div class="p-8 text-center text-slate-400">No ideas pending review.</div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    // Logic to check if points were already given (optional flag)
                    const pointsGivenClass = data.pointsAwarded ? "opacity-50 grayscale" : "";
                    const btnDisable = data.pointsAwarded ? "disabled" : "";

                    const card = `
                        <div class="glass-panel p-6 rounded-xl border border-slate-200 dark:border-slate-700 relative group transition hover:shadow-lg ${pointsGivenClass}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide bg-slate-100 dark:bg-slate-800 text-slate-500 mb-2">
                                        ${data.category || 'General'}
                                    </span>
                                    <h3 class="text-lg font-bold text-slate-800 dark:text-white">${data.title}</h3>
                                    <p class="text-xs text-brand-600 dark:text-brand-400 font-medium mt-1">
                                        By: ${data.userName || 'Unknown User'}
                                    </p>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] text-slate-400 block">${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() : 'Date N/A'}</span>
                                    <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs font-bold ${getStatusColor(data.status)}">
                                        ${data.status || 'New'}
                                    </span>
                                </div>
                            </div>
                            
                            <p class="text-sm text-slate-600 dark:text-slate-300 mb-6 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-800">
                                ${data.description || 'No description.'}
                            </p>

                            <div class="flex items-center gap-3 border-t border-slate-100 dark:border-slate-700/50 pt-4">
                                <div class="flex-1">
                                    <p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Actions</p>
                                    <div class="flex gap-2">
                                        <button onclick="updateStatus('${id}', 'Approved')" class="px-3 py-1.5 rounded bg-brand-100 text-brand-700 hover:bg-brand-200 text-xs font-bold transition">
                                            <i class="fas fa-check"></i> Approve
                                        </button>
                                        <button onclick="updateStatus('${id}', 'Rejected')" class="px-3 py-1.5 rounded bg-red-100 text-red-700 hover:bg-red-200 text-xs font-bold transition">
                                            <i class="fas fa-times"></i> Reject
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="pl-4 border-l border-slate-200 dark:border-slate-700">
                                    <p class="text-[10px] uppercase font-bold text-ocean-400 mb-1">Award Points</p>
                                    <div class="flex gap-1">
                                        <button onclick="givePoints('${data.userId}', '${id}', 10)" ${btnDisable} class="px-2 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-fresh-500 hover:text-white text-xs font-bold transition">+10</button>
                                        <button onclick="givePoints('${data.userId}', '${id}', 50)" ${btnDisable} class="px-2 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-fresh-500 hover:text-white text-xs font-bold transition">+50</button>
                                        <button onclick="givePoints('${data.userId}', '${id}', 100)" ${btnDisable} class="px-2 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-spark-500 hover:text-white text-xs font-bold transition">+100</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    ideasFeed.innerHTML += card;
                });
            } catch (error) {
                console.error(error);
                showToast("Error loading ideas", "error");
            }
        }

        // --- 2. Fetch & Render Leaderboard ---
        window.fetchUsers = async function() {
            try {
                const q = query(collection(db, "users"), orderBy("points", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminLeaderboard.innerHTML = "";
                
                querySnapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    const userId = docSnap.id; // Use Doc ID as User ID
                    
                    const row = `
                        <div class="flex items-center justify-between p-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/50 hover:border-brand-500 transition group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold">
                                    ${user.name ? user.name.charAt(0) : 'U'}
                                </div>
                                <div class="leading-tight">
                                    <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${user.name || 'Anonymous'}</p>
                                    <p class="text-[10px] text-slate-400">${user.email || 'No Email'}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-brand-600 dark:text-brand-400 font-bold text-sm">${user.points || 0} pts</span>
                                <button onclick="manualAdjust('${userId}', '${user.name}')" class="text-slate-400 hover:text-brand-500 p-1 opacity-0 group-hover:opacity-100 transition">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    adminLeaderboard.innerHTML += row;
                });
            } catch(e) { console.error(e); }
        }

        // --- 3. Actions ---
        
        window.updateStatus = async function(docId, newStatus) {
            try {
                const ref = doc(db, "ideas", docId);
                await updateDoc(ref, { status: newStatus });
                showToast(`Idea marked as ${newStatus}`, newStatus === 'Approved' ? 'success' : 'neutral');
                fetchIdeas(); // Refresh UI
            } catch (error) {
                showToast("Error updating status", "error");
            }
        }

        window.givePoints = async function(userId, ideaId, points) {
            if (!userId) { showToast("Error: No User ID linked to this idea", "error"); return; }
            
            try {
                // 1. Update User Points
                // Note: We assume the user document ID is the same as the userId stored in the idea
                // If your user IDs are stored differently, you might need a query here.
                // Assuming standard Auth UIDs:
                const userRef = doc(db, "users", userId);
                
                // Check if user doc exists first
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    showToast("User document not found within Leaderboard", "error");
                    return;
                }

                await updateDoc(userRef, {
                    points: increment(points)
                });

                // 2. Mark Idea as "Points Awarded" so we don't double count
                const ideaRef = doc(db, "ideas", ideaId);
                await updateDoc(ideaRef, {
                    pointsAwarded: true,
                    status: 'Approved' // Auto approve if points given
                });

                showToast(`Awared ${points} points!`, "success");
                fetchIdeas();
                fetchUsers(); // Update leaderboard sidebar

            } catch (error) {
                console.error("Points Error:", error);
                showToast("Failed to award points", "error");
            }
        }

        window.manualAdjust = async function(userId, name) {
            const points = prompt(`Add points for ${name} (use negative to subtract):`, "10");
            if(points && !isNaN(points)) {
                try {
                    const userRef = doc(db, "users", userId);
                    await updateDoc(userRef, { points: increment(parseInt(points)) });
                    showToast("Points updated manually", "success");
                    fetchUsers();
                } catch(e) { showToast("Error", "error"); }
            }
        }

        // --- Utilities ---
        function getStatusColor(status) {
            if (status === 'Approved') return 'bg-brand-100 text-brand-700';
            if (status === 'Rejected') return 'bg-red-100 text-red-700';
            return 'bg-yellow-100 text-yellow-700';
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-slate-600';
            
            toast.className = `toast ${colors} text-white px-6 py-3 rounded-lg shadow-xl font-medium text-sm flex items-center gap-2`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
            
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- Theme Logic ---
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        if (localStorage.theme === 'dark') html.classList.add('dark');
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

    </script>
</body>
</html>
