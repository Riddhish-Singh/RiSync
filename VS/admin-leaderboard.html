<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Vigyanshaala</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' },
                        ocean: { 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        fresh: { 400: '#a3e635', 500: '#84cc16', 600: '#65a30d' },
                    }
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast { animation: slideIn 0.3s ease-out forwards; }
        .modal-enter { animation: modalFadeIn 0.2s ease-out forwards; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <nav class="sticky top-0 z-40 glass-panel border-b border-brand-100 dark:border-brand-900/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg tracking-tight block leading-tight">Admin Console</span>
                        <span class="text-[10px] uppercase font-bold text-brand-600 dark:text-brand-400 tracking-wider">Vigyanshaala Idea Lab</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i class="fas fa-moon dark:hidden text-slate-500"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                    <div class="h-8 w-[1px] bg-slate-200 dark:bg-slate-700"></div>
                    <span id="adminEmail" class="text-xs font-mono text-slate-500 hidden sm:block">Loading...</span>
                    <button id="logoutBtn" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-md font-bold transition">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-8 space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-inbox text-brand-500"></i> Submission Feed
                </h2>
                <button onclick="fetchIdeas()" class="text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1 rounded-md hover:bg-slate-50 transition">
                    <i class="fas fa-sync-alt mr-1"></i> Refresh Ideas
                </button>
            </div>
            <div id="ideasFeed" class="space-y-4"></div>
        </div>

        <div class="lg:col-span-4 space-y-6">
            <div class="glass-panel rounded-xl p-5 border-t-4 border-t-ocean-500 sticky top-24">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-trophy text-yellow-400"></i> Leaderboard
                </h2>
                <div id="adminLeaderboard" class="space-y-2 max-h-[600px] overflow-y-auto pr-1">
                    <div class="text-center text-xs text-slate-400 py-4">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <div id="detailsModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto relative modal-enter">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition z-50 w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-slate-700 shadow-md">
                <i class="fas fa-times"></i>
            </button>
            <div id="modalContent" class="p-0"></div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGpwRwsJfD8QlCHOnXPxxLyGb34ezokgQ",
            authDomain: "vs-idea-labs.firebaseapp.com",
            projectId: "vs-idea-labs",
            storageBucket: "vs-idea-labs.firebasestorage.app",
            messagingSenderId: "789407499622",
            appId: "1:789407499622:web:18758c729f4b283ddcf4a7",
            measurementId: "G-XKFLFPDZLP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allIdeasData = {};

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if(user.email.toLowerCase() !== "hr@vigyanshaala.com") {
                    alert("Unauthorized Access");
                    window.location.href = "index.html";
                }
                document.getElementById('adminEmail').textContent = user.email;
                fetchIdeas();
                fetchUsers();
            } else {
                window.location.href = "admin-login.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        window.fetchIdeas = async function() {
            const feed = document.getElementById('ideasFeed');
            feed.innerHTML = '<div class="text-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-500 mx-auto"></div></div>';
            
            try {
                const q = query(collection(db, "ideas"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                feed.innerHTML = "";
                
                if (querySnapshot.empty) {
                    feed.innerHTML = `<p class="text-center text-slate-400">No submissions found.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    allIdeasData[id] = data;
                    
                    const isAwarded = data.pointsAwarded === true;

                    feed.innerHTML += `
                        <div class="glass-panel p-6 rounded-xl border border-slate-200 dark:border-slate-700 transition hover:shadow-md ${isAwarded ? 'border-l-4 border-l-fresh-500' : ''}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-lg font-bold">${data.title}</h3>
                                    <p class="text-xs text-brand-600 font-medium">By: ${data.userName || 'Anonymous'}</p>
                                </div>
                                <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${getStatusColor(data.status)}">${data.status || 'Pending'}</span>
                            </div>
                            
                            <div class="flex flex-wrap gap-2 mb-4">
                                <button onclick="openModal('${id}')" class="text-xs bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-md hover:bg-brand-500 hover:text-white transition"><i class="fas fa-eye mr-1"></i> View Details</button>
                                <button onclick="updateStatus('${id}', 'Approved')" class="text-xs bg-brand-50 text-brand-700 px-3 py-1.5 rounded-md hover:bg-brand-100 transition">Approve</button>
                                <button onclick="updateStatus('${id}', 'Rejected')" class="text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-md hover:bg-red-100 transition">Reject</button>
                            </div>

                            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                                <span class="text-[10px] uppercase font-bold text-slate-400">Award Points:</span>
                                <div class="flex gap-2">
                                    ${[10, 50, 100].map(pts => `
                                        <button 
                                            onclick="givePoints('${data.userId}', '${id}', ${pts})" 
                                            ${isAwarded ? 'disabled' : ''}
                                            class="px-3 py-1 rounded text-xs font-bold transition ${isAwarded ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-brand-500 text-white hover:bg-brand-600 active:scale-95'}"
                                        >+${pts}</button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) { showToast("Error loading feed", "error"); }
        }

        window.givePoints = async function(userId, ideaId, points) {
            if (!userId || userId === "undefined") {
                showToast("Error: This idea has no User ID attached.", "error");
                console.error("Missing userId for idea:", ideaId);
                return;
            }

            try {
                const userRef = doc(db, "users", userId);
                const ideaRef = doc(db, "ideas", ideaId);

                // Update User Points
                await updateDoc(userRef, { points: increment(points) });
                
                // Mark Idea as Awarded
                await updateDoc(ideaRef, { 
                    pointsAwarded: true, 
                    status: 'Approved',
                    awardedAt: new Date().toISOString()
                });

                showToast(`Success! ${points} points awarded.`, "success");
                fetchIdeas();
                fetchUsers();
            } catch (error) {
                console.error(error);
                showToast("Failed to award points. Check console.", "error");
            }
        }

        window.updateStatus = async function(docId, newStatus) {
            try {
                await updateDoc(doc(db, "ideas", docId), { status: newStatus });
                showToast(`Status updated to ${newStatus}`);
                fetchIdeas();
            } catch (e) { showToast("Update failed", "error"); }
        }

        window.fetchUsers = async function() {
            try {
                const q = query(collection(db, "users"), orderBy("points", "desc"));
                const snap = await getDocs(q);
                const lb = document.getElementById('adminLeaderboard');
                lb.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data();
                    lb.innerHTML += `
                        <div class="flex justify-between p-2 bg-white dark:bg-slate-800 rounded border border-slate-100 dark:border-slate-700 text-sm">
                            <span class="truncate pr-2">${u.name || 'User'}</span>
                            <span class="font-bold text-brand-500">${u.points || 0}</span>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        function getStatusColor(s) {
            if (s === 'Approved') return 'bg-emerald-100 text-emerald-700';
            if (s === 'Rejected') return 'bg-red-100 text-red-700';
            return 'bg-amber-100 text-amber-700';
        }

        function showToast(m, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast p-4 rounded-lg shadow-lg text-white text-sm font-bold ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`;
            t.innerText = m;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        window.openModal = function(id) {
            const d = allIdeasData[id];
            document.getElementById('modalContent').innerHTML = `
                <div class="p-8">
                    <h2 class="text-2xl font-bold mb-4">${d.title}</h2>
                    <div class="space-y-4">
                        <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-lg">
                            <h4 class="font-bold text-brand-600 text-xs uppercase mb-1">The Problem</h4>
                            <p class="text-sm">${d.problem}</p>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-lg">
                            <h4 class="font-bold text-brand-600 text-xs uppercase mb-1">The Solution</h4>
                            <p class="text-sm">${d.solution}</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        window.closeModal = () => document.getElementById('detailsModal').classList.add('hidden');

        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

    </script>
</body>
</html>
