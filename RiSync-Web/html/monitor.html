<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiSync | Live Parent Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --mute: #94a3b8;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
            --yellow: #eab308;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: grid;
            gap: 20px;
        }

        .card {
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-info h1 {
            font-size: 1.75rem;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .header-info p {
            margin: 0;
            color: var(--mute);
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .status-online {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
            border: 2px solid var(--green);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
            border: 2px solid var(--red);
        }

        .status-loading {
            background: rgba(251, 146, 60, 0.15);
            color: var(--orange);
            border: 2px solid var(--orange);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Stats Grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--mute);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 8px;
            color: var(--accent);
            word-break: break-word;
        }

        .stat-value.active {
            color: var(--green);
        }

        .stat-value.inactive {
            color: var(--orange);
        }

        /* Activity Feed */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .feed-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .feed-controls {
            display: flex;
            gap: 8px;
        }

        .feed-btn {
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .feed-btn:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .feed-box {
            height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 8px;
        }

        .feed-box::-webkit-scrollbar {
            width: 6px;
        }

        .feed-box::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .feed-box::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }

        .feed-box::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--mute);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .log {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 4px solid var(--mute);
            font-size: 0.9rem;
            transition: all 0.2s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .log.focus {
            border-left-color: var(--green);
            background: rgba(34, 197, 94, 0.05);
        }

        .log.blur {
            border-left-color: var(--orange);
            background: rgba(245, 158, 11, 0.05);
        }

        .log.navigation {
            border-left-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .log-time {
            color: var(--mute);
            min-width: 70px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .log-detail {
            color: var(--text);
            flex: 1;
        }

        .log-detail strong {
            color: var(--accent);
        }

        .error-banner {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            border-radius: 8px;
            color: var(--red);
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .error-banner.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .connection-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            padding: 2px 8px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 4px;
            color: var(--green);
        }

        .connection-indicator.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: blink 2s infinite;
        }

        .connection-indicator.disconnected .dot {
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .feed-box {
                height: 350px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="card">
        <div class="error-banner" id="errorBanner"></div>

        <div class="header">
            <div class="header-info">
                <h1>RiSync Monitor</h1>
                <p>Real-time child activity tracking</p>
            </div>
            <div>
                <div id="statusBadge" class="status-badge status-loading">Loading...</div>
                <div id="connectionStatus" class="connection-indicator disconnected" style="margin-top: 10px;">
                    <span class="dot"></span>
                    <span>Connecting...</span>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="currStatus">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Current Page</div>
                <div class="stat-value" id="currPage">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Scroll Depth</div>
                <div class="stat-value" id="scrollDepth">0%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Tab Focus</div>
                <div class="stat-value" id="tabStatus">Unknown</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Last Activity</div>
                <div class="stat-value" id="lastActivity">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Session Duration</div>
                <div class="stat-value" id="sessionTime">00:00</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="feed-header">
            <h3>📊 Live Activity Feed</h3>
            <div class="feed-controls">
                <button class="feed-btn" onclick="clearLogs()">Clear</button>
                <button class="feed-btn" onclick="toggleAutoScroll()">Auto-scroll</button>
            </div>
        </div>
        <div class="feed-box" id="feed">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <p>Waiting for activity...</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast, onDisconnect } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBWAwm_TDtD1qXDtjxJu0jrDP45c3p1Bxg",
        authDomain: "risync-risync.firebaseapp.com",
        projectId: "risync-risync",
        storageBucket: "risync-risync.firebasestorage.app",
        messagingSenderId: "195106250121",
        appId: "1:195106250121:web:57b23c5b94d5771995d558",
        measurementId: "G-D5WSLQ706Z"
    };

    // Initialize Firebase
    try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const USER_ID = "child_001";

        let autoScroll = true;
        let sessionStartTime = Date.now();
        let currentData = {
            state: 'offline',
            current_page: 'Unknown',
            scroll_depth: 0,
            tab_visible: false
        };

        // Update session timer
        setInterval(() => {
            const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            document.getElementById('sessionTime').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }, 1000);

        // Show error message
        function showError(message) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = message;
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 5000);
        }

        // Update connection status UI
        function updateConnectionStatus(connected) {
            const el = document.getElementById('connectionStatus');
            if (connected) {
                el.classList.remove('disconnected');
                el.innerHTML = '<span class="dot"></span><span>Connected</span>';
            } else {
                el.classList.add('disconnected');
                el.innerHTML = '<span class="dot"></span><span>Disconnected</span>';
            }
        }

        // 1. Listen for Status Updates
        onValue(ref(db, `monitoring/${USER_ID}/status`), (snap) => {
            const data = snap.val();
            updateConnectionStatus(true);

            if (!data) {
                updateConnectionStatus(false);
                document.getElementById('statusBadge').textContent = "OFFLINE";
                document.getElementById('statusBadge').className = "status-badge status-offline";
                document.getElementById('currStatus').textContent = "Offline";
                return;
            }

            currentData = data;

            // Update Status Badge
            const badge = document.getElementById('statusBadge');
            if (data.state === 'online') {
                badge.textContent = "🟢 ACTIVE NOW";
                badge.className = "status-badge status-online";
                document.getElementById('currStatus').textContent = "Active";
                document.getElementById('currStatus').className = "stat-value active";
            } else {
                badge.textContent = "🔴 OFFLINE";
                badge.className = "status-badge status-offline";
                document.getElementById('currStatus').textContent = "Offline";
                document.getElementById('currStatus').className = "stat-value";
            }

            // Update Stats
            document.getElementById('currPage').textContent = data.current_page || "Unknown";
            document.getElementById('scrollDepth').textContent = (data.scroll_depth || 0) + "%";

            // Tab Status
            const tabEl = document.getElementById('tabStatus');
            if (data.tab_visible) {
                tabEl.textContent = "👁️ Focused";
                tabEl.className = "stat-value active";
            } else {
                tabEl.textContent = "⏸️ Hidden";
                tabEl.className = "stat-value inactive";
            }

            // Last Activity
            if (data.last_activity_time) {
                const actTime = new Date(data.last_activity_time);
                const now = new Date();
                const diff = Math.floor((now - actTime) / 1000);
                
                let timeStr;
                if (diff < 60) {
                    timeStr = diff + "s ago";
                } else if (diff < 3600) {
                    timeStr = Math.floor(diff / 60) + "m ago";
                } else {
                    timeStr = Math.floor(diff / 3600) + "h ago";
                }
                document.getElementById('lastActivity').textContent = timeStr;
            }

        }, (error) => {
            updateConnectionStatus(false);
            showError("Failed to connect to monitoring service: " + error.message);
        });

        // 2. Listen for Activity Logs
        const logQuery = query(ref(db, `monitoring/${USER_ID}/logs`), limitToLast(30));
        onValue(logQuery, (snap) => {
            const feed = document.getElementById('feed');
            const logs = [];

            snap.forEach(child => {
                logs.push(child.val());
            });

            // Check if empty
            if (logs.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <p>No activity logged yet</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = "";
            logs.reverse().forEach(log => {
                const div = document.createElement('div');
                let typeClass = "";
                let icon = "";

                if (log.action.includes("FOCUS")) {
                    typeClass = "focus";
                    icon = "👁️";
                } else if (log.action.includes("HIDDEN")) {
                    typeClass = "blur";
                    icon = "⏸️";
                } else if (log.action.includes("NAV") || log.action.includes("NAVIGATION")) {
                    typeClass = "navigation";
                    icon = "🔗";
                } else if (log.action.includes("SCROLL")) {
                    icon = "📜";
                } else if (log.action.includes("CLICK")) {
                    icon = "🖱️";
                } else {
                    icon = "📝";
                }

                const timestamp = new Date(log.timestamp);
                const timeStr = timestamp.toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });

                div.className = `log ${typeClass}`;
                div.innerHTML = `
                    <div class="log-time">${timeStr}</div>
                    <div class="log-detail">
                        <strong>${icon} ${log.action}</strong>
                        <br/>
                        <span style="opacity: 0.8; font-size: 0.85rem;">${log.details || 'No details'}</span>
                    </div>
                `;
                feed.appendChild(div);

                // Auto-scroll to bottom
                if (autoScroll) {
                    feed.scrollTop = feed.scrollHeight;
                }
            });
        }, (error) => {
            showError("Failed to fetch logs: " + error.message);
        });

        // Global Functions
        window.clearLogs = function() {
            const feed = document.getElementById('feed');
            feed.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 4 21 4 23 6 23 20a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6"></polyline>
                        <line x1="10" y1="12" x2="14" y2="12"></line>
                    </svg>
                    <p>Logs cleared</p>
                </div>
            `;
        };

        window.toggleAutoScroll = function() {
            autoScroll = !autoScroll;
            const btn = event.target;
            btn.textContent = autoScroll ? "Auto-scroll" : "Auto-scroll (OFF)";
            btn.style.opacity = autoScroll ? "1" : "0.6";
        };

        // Initial connection message
        updateConnectionStatus(false);

    } catch (error) {
        console.error("Firebase initialization error:", error);
        document.body.innerHTML += `
            <div style="color: var(--red); padding: 20px; text-align: center;">
                <p>Failed to initialize monitoring:</p>
                <p style="font-size: 0.9rem; opacity: 0.8;">${error.message}</p>
            </div>
        `;
    }
</script>

</body>
</html>
