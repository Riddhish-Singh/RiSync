<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiSync Sign-In</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-image: url('https://raw.githubusercontent.com/Riddhish-Singh/RiSync-Web/main/assets/image.png');
      background-size: cover;
      background-position: center;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: rgba(0, 51, 102, 0.85);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    .logo img {
      width: 100px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: bold;
      color: #FFFFFF;
      margin-bottom: 20px;
    }
    label {
      font-size: 14px;
      font-weight: bold;
      display: block;
      text-align: left;
      color: white;
      margin-bottom: 5px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 5px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      transition: background-color 0.3s ease;
    }
    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      background-color: rgba(255, 255, 255, 0.3);
    }
    .error {
      color: #FF6F61;
      font-size: 12px;
      margin-bottom: 10px;
      text-align: left;
      min-height: 18px;
    }
    .signin-button,
    .go-back-button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: transform 0.3s, background-color 0.3s;
    }
    .signin-button {
      background-color: #FF5722;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin-top: 10px;
    }
    .signin-button:hover {
      background-color: #002244;
      transform: scale(1.05);
    }
    .go-back-button {
      background-color: #004AAD;
      color: white;
      margin-top: 15px;
    }
    .go-back-button:hover {
      background-color: #003a87;
    }
    .create-account {
      text-align: center;
      margin-top: 15px;
    }
    .create-account a {
      color: #FF5722;
      text-decoration: none;
      font-size: 14px;
    }
    .create-account a:hover {
      text-decoration: underline;
    }
    #showPasswordContainer {
      text-align: left;
      margin-bottom: 10px;
      color: white;
      font-size: 14px;
    }
    #showPassword {
      vertical-align: middle;
      margin-right: 6px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }
    @media screen and (max-width: 480px) {
      .container {
        padding: 25px;
        max-width: 90%;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
       <a href="../index.html" class="logo">
         <img src="../assets/logo.png" alt="RiSync Logo" style="width:80px; height:auto;">
       </a>
    </div>
    <h1>RiSync Sign-In</h1>
    
    <form id="signinForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="username" required />
      <div id="emailError" class="error"></div>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
      <div id="passwordError" class="error"></div>

      <div id="showPasswordContainer">
        <input type="checkbox" id="showPassword" />
        <label for="showPassword" style="display: inline;">Show Password</label>
      </div>

      <button type="submit" class="signin-button" aria-label="Sign in to your RiSync account">Sign In</button>
    </form>

    <div class="create-account">
      <p>New to RiSync? <a href="signup.html">Create your account</a>.</p>
    </div>

    <button type="button" class="go-back-button" onclick="window.location.href='../index.html'">GO BACK TO THE MAIN PAGE</button>
  </div>

  <script type="module">
    // --- FIREBASE CONFIGURATION ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWAwm_TDtD1qXDtjxJu0jrDP45c3p1Bxg",
      authDomain: "risync-risync.firebaseapp.com",
      projectId: "risync-risync",
      storageBucket: "risync-risync.firebasestorage.app",
      messagingSenderId: "195106250121",
      appId: "1:195106250121:web:57b23c5b94d5771995d558",
      measurementId: "G-D5WSLQ706Z"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // --- DOM ELEMENT REFERENCES ---
    const signinForm = document.getElementById('signinForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const showPasswordCheckbox = document.getElementById('showPassword');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    // --- EVENT LISTENERS ---

    // 1. Toggle Password Visibility
    showPasswordCheckbox.addEventListener('change', () => {
      passwordInput.type = showPasswordCheckbox.checked ? "text" : "password";
    });

    // 2. Handle Form Submission (Sign In)
    signinForm.addEventListener('submit', async (event) => {
      event.preventDefault(); // Prevent page reload

      // Clear previous errors
      emailError.textContent = "";
      passwordError.textContent = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        // Attempt to sign in with Firebase
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Optional: You can still save email to localStorage if other pages expect it
        // localStorage.setItem("currentUserEmail", email);

        // Show success and redirect
        alert("Sign-in successful!");
        window.location.href = "content.html";

      } catch (error) {
        console.error("Error signing in:", error);
        
        // Handle specific Firebase error codes
        switch (error.code) {
          case 'auth/invalid-email':
            emailError.textContent = "Please enter a valid email address.";
            break;
          case 'auth/user-not-found':
            emailError.textContent = "No account found with this email.";
            break;
          case 'auth/wrong-password':
            passwordError.textContent = "Incorrect password.";
            break;
          case 'auth/too-many-requests':
            emailError.textContent = "Too many failed attempts. Please try again later.";
            break;
          case 'auth/invalid-credential':
             // New Firebase generic error for security
             passwordError.textContent = "Incorrect email or password.";
             break;
          default:
            emailError.textContent = "Sign-in failed. Please check your connection.";
        }
      }
    });
  </script>
</body>
</html>
