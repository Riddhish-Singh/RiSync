<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI GuruKul — Offer Proposal Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }
  input, select, textarea { font-family: inherit; }

  /* Layout */
  #app { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

  /* Header */
  .header-bar { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #1e3a5f, #2563a8); border-radius: 12px; padding: 14px 20px; margin-bottom: 20px; }
  .header-logo { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,0.35); background: #f5f0e8; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .header-text { flex: 1; }
  .header-text h1 { margin: 0; color: #fff; font-weight: 700; font-size: 18px; }
  .header-text p { margin: 3px 0 0; color: rgba(255,255,255,0.65); font-size: 12.5px; }
  .header-ref { background: rgba(255,255,255,0.12); border-radius: 7px; padding: 4px 12px; font-size: 11px; color: rgba(255,255,255,0.75); }

  /* Stepper */
  .stepper { display: flex; align-items: center; margin-bottom: 20px; padding: 13px 20px; background: #fafafa; border: 1px solid #eee; border-radius: 10px; }
  .step-item { display: flex; align-items: center; flex: 1; }
  .step-item:last-child { flex: none; }
  .step-circle { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #999; background: #e5e5e5; flex-shrink: 0; }
  .step-circle.active { background: #1e3a5f; color: #fff; }
  .step-circle.done { background: #16a34a; color: #fff; }
  .step-label { margin-left: 10px; }
  .step-label .step-num { font-size: 10.5px; color: #aaa; margin: 0; }
  .step-label .step-name { font-size: 13px; font-weight: 500; color: #777; margin: 0; }
  .step-label .step-name.active { font-weight: 700; color: #1e3a5f; }
  .step-line { flex: 1; height: 2px; background: #e5e5e5; margin: 0 16px; border-radius: 2px; }
  .step-line.done { background: #16a34a; }

  /* Card */
  .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 24px 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 13px; border-bottom: 1px solid #f0f0f0; }
  .card-title { margin: 0; font-weight: 700; font-size: 16px; color: #1a1a2e; }
  .badge-generated { background: #fff3cd; color: #b45309; border: 1px solid #fcd34d; border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 600; display: none; }

  /* Form */
  .info-box { background: #f7fbff; border: 1px solid #dce8f5; border-radius: 9px; padding: 12px 16px; margin-bottom: 18px; font-size: 12.5px; color: #666; line-height: 1.6; }
  .section-head { margin: 20px 0 12px; padding-bottom: 7px; border-bottom: 2px solid #e8f0fa; }
  .section-head p { margin: 0; font-size: 12px; font-weight: 700; color: #2563a8; text-transform: uppercase; letter-spacing: 0.7px; }
  .section-head span { color: #1e3a5f; margin-right: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 18px; }
  .span-full { grid-column: 1 / -1; }
  .field label { display: block; margin: 0 0 4px; font-size: 11.5px; font-weight: 600; color: #444; }
  .field label .req { color: #f24646; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px; border: 1.5px solid #ddd; border-radius: 7px;
    font-size: 13px; color: #1a1a2e; outline: none; background: #fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #2563a8; }
  .field textarea { resize: vertical; }
  .field input[readonly] { background: #f5f5f5; color: #777; cursor: default; }
  .field input.ctc-total { background: #edf7ed; color: #166534; font-weight: 700; }
  .hint { font-size: 12px; color: #888; margin: 0 0 12px; }
  .form-footer { display: flex; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }

  /* Buttons */
  .btn { padding: 10px 22px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { background: #1e3a5f; color: #fff; padding: 11px 32px; font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
  .btn-outline { background: transparent; color: #555; border: 1.5px solid #ddd; }
  .btn-danger-outline { background: #fff3f3; color: #f24646; border: 1.5px solid #f24646; }
  .btn-navy { background: #1e3a5f; color: #fff; padding: 10px 28px; font-weight: 700; }
  .preview-actions { display: flex; justify-content: space-between; margin-top: 16px; gap: 10px; }
  .preview-actions-right { display: flex; gap: 10px; }

  /* Letter Preview */
  .letter {
    background: #fff; border: 1px solid #ccc; border-radius: 4px;
    padding: 52px 60px; font-size: 13px; line-height: 1.85; color: #1a1a1a;
    position: relative; font-family: 'Times New Roman', serif;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  .letter-top-bar { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1e3a5f, #2563a8); }
  .letter-bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #2563a8, #1e3a5f); }
  .letter-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .letter-logo-wrap { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 2px solid #2563a8; background: #f5f0e8; flex-shrink: 0; }
  .letter-logo-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .letter-company { border-bottom: 1px solid #dce8f5; padding-bottom: 12px; margin-bottom: 20px; font-family: Arial, sans-serif; }
  .letter-company .name { margin: 0; font-size: 11.5px; font-weight: 700; color: #1e3a5f; }
  .letter-company .ref { margin: 3px 0 0; font-size: 10.5px; color: #888; }
  .letter h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; color: #1e3a5f; font-family: Arial, sans-serif; letter-spacing: -0.3px; }
  .letter .role-title { margin: 0 0 2px; font-size: 15px; font-weight: 700; color: #2563a8; font-family: Arial, sans-serif; }
  .letter .letter-date { margin: 0 0 28px; font-size: 12.5px; color: #666; font-family: Arial, sans-serif; }
  .letter .sec-title { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: #1e3a5f; font-family: Arial, sans-serif; border-bottom: 1px solid #dce8f5; padding-bottom: 5px; }
  .letter p { font-family: Arial, sans-serif; }
  .tags { display: flex; gap: 10px; margin: 12px 0 20px; flex-wrap: wrap; }
  .tag { background: #e8f0fa; color: #1e3a5f; font-size: 11.5px; font-weight: 700; padding: 5px 14px; border-radius: 4px; font-family: Arial, sans-serif; }
  .letter table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-family: Arial, sans-serif; }
  .letter th { background: #1e3a5f; color: #fff; padding: 9px 14px; font-size: 12.5px; font-weight: 700; border: 1px solid #1e3a5f; }
  .letter th.right { text-align: right; }
  .letter td { padding: 8px 14px; font-size: 12.5px; border: 1px solid #dce8f5; }
  .letter td.right { text-align: right; }
  .letter td.bold { font-weight: 700; }
  .letter td.navy-bg { background: #f0f6ff; color: #1e3a5f; }
  .letter td.group-hd { font-size: 12px; font-weight: 700; background: #f0f6ff; color: #1e3a5f; }
  .letter td.faint-bg { background: #fafcff; font-weight: 700; color: #1e3a5f; vertical-align: top; }
  .letter td.total-row { padding: 10px 14px; font-weight: 900; font-size: 13px; background: #1e3a5f; color: #fff; border: 1px solid #1e3a5f; }
  .letter td.total-row.right { text-align: right; }
  .letter ul { margin: 0 0 24px; padding-left: 20px; font-family: Arial, sans-serif; font-size: 12.5px; line-height: 1.85; color: #333; }
  .offer-validity { background: #fff8e1; border: 1px solid #fcd34d; border-radius: 6px; padding: 10px 16px; margin-bottom: 28px; font-family: Arial, sans-serif; font-size: 12.5px; color: #92400e; }
  .sig-row { display: flex; justify-content: space-between; align-items: flex-end; font-family: Arial, sans-serif; }
  .sig-line { width: 150px; height: 1px; background: #555; margin-bottom: 8px; }
  .acceptance-block { margin-top: 32px; padding-top: 20px; border-top: 1px dashed #ccc; font-family: Arial, sans-serif; }
  .acceptance-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .sig-box { flex: 1; min-width: 160px; }
  .sig-box-line { height: 1px; background: #aaa; margin-bottom: 6px; }
  .accept-btn { padding: 7px 22px; border: 2px solid #16a34a; border-radius: 5px; font-size: 13px; font-weight: 700; color: #16a34a; cursor: pointer; background: #fff; font-family: inherit; }
  .decline-btn { padding: 7px 22px; border: 2px solid #f24646; border-radius: 5px; font-size: 13px; font-weight: 700; color: #f24646; cursor: pointer; background: #fff; font-family: inherit; }
  .letter-footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid #dce8f5; font-family: Arial, sans-serif; font-size: 10.5px; color: #aaa; }

  @media print {
    body { background: white; }
    #app { padding: 0; max-width: 100%; }
    .header-bar, .stepper, .card-header, .preview-actions { display: none !important; }
    .card { border: none; box-shadow: none; padding: 0; }
    .letter { box-shadow: none; }
  }

  /* EmailJS Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#fff; border-radius:14px; padding:28px 32px; max-width:460px; width:90%; box-shadow:0 8px 40px rgba(0,0,0,0.18); }
  .modal-box h3 { margin:0 0 6px; font-size:17px; color:#1e3a5f; }
  .modal-box p { margin:0 0 18px; font-size:13px; color:#777; }
  .modal-field { margin-bottom:14px; }
  .modal-field label { display:block; font-size:11.5px; font-weight:600; color:#444; margin-bottom:4px; }
  .modal-field input { width:100%; padding:9px 12px; border:1.5px solid #ddd; border-radius:7px; font-size:13px; font-family:inherit; outline:none; box-sizing:border-box; }
  .modal-field input:focus { border-color:#2563a8; }
  .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn-green { background:#16a34a; color:#fff; border:none; padding:10px 26px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-green:disabled { background:#86b89e; cursor:not-allowed; }
  .toast { display:none; position:fixed; bottom:28px; right:28px; background:#1e3a5f; color:#fff; padding:13px 22px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:2000; box-shadow:0 4px 18px rgba(0,0,0,0.18); }
  .toast.show { display:block; }
  .toast.error { background:#c0392b; }
  @media (max-width: 600px) {
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .span-full { grid-column: 1; }
    .letter { padding: 28px 18px; }
    .sig-row { flex-direction: column; align-items: flex-start; gap: 16px; }
  }
</style>
</head>

<script>

const REF_NO = "OL/" + new Date().getFullYear() + "/" + Math.floor(1000 + Math.random() * 9000);

const DESIGNATIONS = [
  "Client Engagement Lead","AI Instructor","ML Engineer","Data Scientist",

  "Client Engagement","AI & Machine Learning","Product","Engineering",

];

const EMAILJS_SERVICE_ID  = "service_dbrxwcc";
const EMAILJS_TEMPLATE_ID = "template_lrd0vxq";
const EMAILJS_PUBLIC_KEY  = "wE5czNrnX73D-1gj8";
const APPS_SCRIPT_URL     = "https://script.google.com/macros/s/AKfycbwnYcRW72ryXU9Wu0bDWUkD8gKeCGIHWNz8F5A0H6gh7vysx06MMJS1rdh9F5yIj4D6oQ/exec";

(function(){ emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); })();

function openSendModal() {
  document.getElementById("modal-to-email").value = form.candidateEmail || "";
  document.getElementById("modal-to-name").value  = form.candidateName  || "";
  document.getElementById("sendModal").classList.add("open");
}

  document.getElementById("sendModal").classList.remove("open");
}
function showToast(msg, isError) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(function(){ t.className = "toast"; }, 4000);
}

function buildEmailBody(candidateName, driveLink) {
  var d = calc();
  var firstName = (candidateName || form.candidateName || "Candidate").split(" ")[0];
  return "Dear " + firstName + ",\n\n"
    + "Heartiest Congratulations!\n\n"
    + "We are delighted to welcome you to Team VTION.\n\n"
    + "We are pleased to offer you the position of " + form.designation
    + ", based out of " + (form.location || "Mumbai")
    + ", reporting to " + (form.reportingTo || "the Management") + ".\n\n"
    + "Remuneration Details\n\n"
    + "Your total annual remuneration will be \u20B9" + d.totalCTC.toLocaleString("en-IN")
    + " per annum, comprising:\n\n"
    + "\u2022 Fixed Compensation: \u20B9" + d.fixedPay.toLocaleString("en-IN") + " per annum\n"
    + "\u2022 Annual Variable Pay: \u20B9" + d.variableNum.toLocaleString("en-IN") + " per annum\n\n"
    + "Please find the detailed offer proposal here: " + driveLink + "\n\n"
    + "The proposal outlines the role scope, compensation structure, benefits, and other terms of employment.\n\n"
    + "We believe your experience and leadership capabilities will play an important role in strengthening VTION's enterprise client engagement and growth journey. We are excited about the possibility of having you onboard.\n\n"
    + "Should you wish to discuss any aspect of the offer further, we would be happy to connect.\n\n"
    + "Kindly confirm your acceptance of the offer by acknowledging this email within the validity timeline mentioned in the offer proposal.\n\n"
    + "We look forward to working with you and welcoming you to VTION.\n\n"
    + "Warm regards,\nOn behalf of Team VTION\nHR Team";
}

async function generatePdfBase64() {
  var element = document.getElementById("preview");
  var opt = {
    margin: 0,
    filename: "offer.pdf",
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
  };
  var pdf = await html2pdf().set(opt).from(element).outputPdf("arraybuffer");
  var binary = "";
  var bytes = new Uint8Array(pdf);
  for (var i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

async function uploadToDrive(base64, fileName) {
  // Apps Script requires Content-Type text/plain to avoid CORS preflight
  var response = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ pdf: base64, fileName: fileName })
  });
  var text = await response.text();
  var data;
  try { data = JSON.parse(text); } catch(e) { throw new Error("Drive upload failed: " + text); }
  if (data.error) throw new Error(data.error);
  if (!data.url) throw new Error("No Drive link returned. Check your Apps Script.");
  return data.url;
}

async function sendEmail() {
  var toEmail = document.getElementById("modal-to-email").value.trim();
  var toName  = document.getElementById("modal-to-name").value.trim();
  if (!toEmail) { showToast("Please enter the recipient email.", true); return; }

  var btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.textContent = "Generating PDF\u2026";

  try {
    // Step 1: Generate PDF
    btn.textContent = "Generating PDF\u2026";
    var fileName = "Offer_" + (form.candidateName || "Candidate").replace(/\s+/g, "_") + "_" + REF_NO + ".pdf";
    var base64 = await generatePdfBase64();

    // Step 2: Upload to Drive
    btn.textContent = "Uploading to Drive\u2026";
    var driveLink;
    try {
      driveLink = await uploadToDrive(base64, fileName);
    } catch(driveErr) {
      throw new Error("Drive upload failed: " + (driveErr.message || driveErr));
    }

    // Step 3: Send email with Drive link
    btn.textContent = "Sending Email\u2026";
    var templateParams = {
      to_email: toEmail,
      to_name:  toName || form.candidateName || "Candidate",
      subject:  "Offer Proposal - " + form.designation + " | " + REF_NO,
      message:  buildEmailBody(toName, driveLink)
    };
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams, { publicKey: EMAILJS_PUBLIC_KEY });
    } catch(ejErr) {
      throw new Error("EmailJS failed: " + (ejErr.text || ejErr.message || JSON.stringify(ejErr)));
    }

    closeModal();
    showToast("\u2705 Offer sent & saved to Drive successfully!");

  } catch(err) {
    console.error("Send error:", err);
    var msg = err.text || err.message || JSON.stringify(err) || "Unknown error";
    showToast("\u274C Failed: " + msg, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Send Offer \u2192";
  }
}

function fmtDate(str) {
  if (!str) return "—";
  return new Date(str).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
}
function fmtINR(n) {
  if (!n) return "—";
  return "₹" + Number(n).toLocaleString("en-IN");
}
function fmt(n) {
  return n ? n.toLocaleString("en-IN") : "—";
}
function fmtM(n) {
  return n ? Math.round(n/12).toLocaleString("en-IN") : "—";
}

let form = {

function calc() {
  const stipendNum = Number(form.monthlyStipend) || 0;
  if (isIntern()) {
    return { isInternMode: true, stipendNum, basicNum:0, hraCalc:0, hraRate:0, specialNum:0, variableNum:0, pfNum:0, fixedPay:0, totalCTC: stipendNum * 12 };
  }
  const basicNum = Number(form.basicSalary) || 0;
  // Employees get 50% HRA; Contract gets 40%
  const hraRate = isEmployee() ? 0.5 : 0.4;
  const hraCalc = Math.round(basicNum * hraRate);
  const specialNum = Number(form.specialAllowance) || 0;
  const variableNum = Number(form.variablePay) || 0;
  const pfNum = Number(form.pfContribution) || 0;
  const fixedPay = basicNum + hraCalc + specialNum;
  const totalCTC = fixedPay + variableNum + pfNum;
  return { isInternMode: false, stipendNum:0, basicNum, hraCalc, hraRate, specialNum, variableNum, pfNum, fixedPay, totalCTC };
}

function setField(key, val) {
  form[key] = val;

  updateComputedFields();
}

function updateComputedFields() {
  const d = calc();
  const hraEl = document.getElementById('hra-display');
  const ctcEl = document.getElementById('ctc-display');

  if (hraEl && hraLbl) {
    hraLbl.textContent = "HRA (Auto: " + Math.round(d.hraRate * 100) + "% of Basic)";
    hraEl.value = d.basicNum ? "\u20B9" + d.hraCalc.toLocaleString("en-IN") : "";
  }
  if (ctcEl) ctcEl.value = d.totalCTC ? "\u20B9" + d.totalCTC.toLocaleString("en-IN") : "";
}

function field(label, id, opts = {}) {
  const { type = "text", placeholder = "", required = false, spanFull = false, rows = 0, readonly = false, cls = "" } = opts;
  const val = form[id] !== undefined ? form[id] : "";
  const spanClass = spanFull ? ' span-full' : '';
  const reqMark = required ? '<span class="req"> *</span>' : '';

  let input;
  if (opts.datalist) {
    const listId = `dl-${id}`;
    const optHtml = opts.datalist.map(o => `<option value="${o}"></option>`).join('');
    input = `<input id="f-${id}" type="text" list="${listId}" value="${val.replace(/"/g,'&quot;')}" placeholder="${placeholder || 'Type or pick a title…'}" oninput="setField('${id}', this.value)" autocomplete="off"><datalist id="${listId}">${optHtml}</datalist>`;
  } else if (opts.options) {
    const optHtml = opts.options.map(o => `<option value="${o}"${val === o ? ' selected' : ''}>${o}</option>`).join('');
    const extraChange = opts.triggerRender ? " render();" : "";
    input = `<select id="f-${id}" onchange="setField('${id}', this.value);${extraChange}">${optHtml}</select>`;
  } else if (rows > 0) {
    input = `<textarea id="f-${id}" rows="${rows}" placeholder="${placeholder}" oninput="setField('${id}', this.value)">${val}</textarea>`;
  } else if (readonly) {
    input = `<input id="${id}" type="text" readonly value="${val}" placeholder="${placeholder || 'Auto-calculated'}" class="${cls}">`;
  } else {
    input = `<input id="f-${id}" type="${type}" value="${val.replace(/"/g,'&quot;')}" placeholder="${placeholder}" oninput="setField('${id}', this.value)">`;
  }
  return `<div class="field${spanClass}"><label>${label}${reqMark}</label>${input}</div>`;
}

function sec(n, text) {
  return `<div class="section-head"><p>${n ? `<span>${n}.</span>` : ''}${text}</p></div>`;
}


function renderCompFields() {

      '<tr><td class="group-hd" colspan="3">A. Basic Salary</td></tr>' +
