<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RiSync Workspace | AI Integrated</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* --- THEME ENGINE --- */
    :root {
      /* Light Theme (Default) */
      --bg-app: #d1d7db;
      --bg-body: #d1d7db;
      --sidebar-bg: #ffffff;
      --header-bg: #f0f2f5;
      --chat-bg: #efeae2;
      --primary: #008069;
      --primary-dark: #006d59;
      --accent: #f58220; /* Senior/Gold */
      --ai-color: #6c5ce7; /* Ribot Purple */
      --text-main: #111b21;
      --text-sub: #54656f;
      --border: #e9edef;
      --input-bg: #f0f2f5;
      --shadow: rgba(11, 20, 26, 0.1);
      --strip-color: #00a884;
      --modal-overlay: rgba(255, 255, 255, 0.8);
      --msg-sent: #d9fdd3;
      --msg-received: #ffffff;
    }

    [data-theme="dark"] {
      --bg-app: #111b21;
      --bg-body: #0c1317;
      --sidebar-bg: #111b21;
      --header-bg: #202c33;
      --chat-bg: #0b141a;
      --primary: #00a884;
      --primary-dark: #02906f;
      --ai-color: #a29bfe;
      --text-main: #e9edef;
      --text-sub: #8696a0;
      --border: #222d34;
      --input-bg: #202c33;
      --shadow: rgba(0, 0, 0, 0.3);
      --strip-color: #202c33;
      --modal-overlay: rgba(0, 0, 0, 0.85);
      --msg-sent: #005c4b;
      --msg-received: #202c33;
    }

    * { box-sizing: border-box; transition: background-color 0.2s ease, color 0.1s ease; }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-body);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Decorative Green Strip */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 127px;
      background-color: var(--strip-color);
      z-index: 0;
      transition: background-color 0.3s ease;
    }

    /* Main App Window */
    .app-container {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      background-color: var(--bg-app);
      display: flex;
      z-index: 10;
      box-shadow: 0 17px 50px 0 var(--shadow);
      overflow: hidden;
    }

    @media (min-width: 1441px) {
      .app-container {
        height: calc(100% - 38px);
        top: 19px;
        border-radius: 4px;
      }
    }

    /* --- SIDEBAR --- */
    aside.sidebar {
      width: 350px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background-color: var(--sidebar-bg);
      position: relative;
    }

    header {
      height: 60px;
      background-color: var(--header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .user-profile-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
    }
    .user-profile-section:hover { background-color: rgba(0,0,0,0.04); }

    .user-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .user-name-display {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }

    .header-icons { display: flex; gap: 24px; color: var(--text-sub); }
    .header-icons i { cursor: pointer; font-size: 18px; transition: color 0.2s; }
    .header-icons i:hover { color: var(--text-main); }

    /* Search & Filter */
    .search-bar-container {
      background-color: var(--sidebar-bg);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search-input-wrapper {
      background-color: var(--input-bg);
      border-radius: 8px;
      padding: 8px 15px;
      display: flex;
      align-items: center;
    }
    .search-input-wrapper input {
      border: none;
      background: transparent;
      margin-left: 10px;
      width: 100%;
      outline: none;
      font-size: 14px;
      color: var(--text-main);
    }

    /* Chat List */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      background-color: var(--sidebar-bg);
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 0 15px;
      height: 72px;
      cursor: pointer;
      position: relative;
    }
    .chat-item:hover { background-color: var(--input-bg); }
    .chat-item.active { background-color: var(--header-bg); }
    
    .chat-item img {
      width: 48px; height: 48px;
      border-radius: 50%;
      margin-right: 15px;
    }
    .chat-info {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }
    .chat-item:last-child .chat-info { border-bottom: none; }

    .chat-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .chat-name { font-size: 16px; color: var(--text-main); font-weight: 500; }
    .chat-time { font-size: 12px; color: var(--text-sub); }
    .chat-msg { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    /* Senior/Premium Footer */
    .senior-section {
      padding: 15px;
      background: var(--header-bg);
      border-top: 1px solid var(--border);
    }
    .senior-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .senior-header h4 {
      margin: 0; font-size: 13px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .credit-badge {
      background: var(--sidebar-bg); color: var(--accent);
      padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; border: 1px solid var(--border);
    }
    .senior-controls { display: flex; gap: 8px; }
    
    select.custom-select {
      flex: 1; padding: 8px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--sidebar-bg); color: var(--text-main); font-size: 14px; outline: none;
    }
    
    .btn-go {
      background-color: var(--primary); color: white; border: none; border-radius: 6px; width: 40px; cursor: pointer; transition: 0.2s;
    }
    .btn-go:hover { background-color: var(--primary-dark); transform: translateY(-1px); }
    .btn-go:disabled { background-color: var(--text-sub); opacity: 0.5; cursor: not-allowed; }

    /* --- RIGHT CHAT AREA --- */
    main.chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239ca3af' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
      position: relative;
    }

    /* Iframe Wrapper - Hiding the URL */
    .view-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: none; /* Hidden by default */
    }
    .view-wrapper.active { display: flex; flex-direction: column; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }
    iframe.loaded { opacity: 1; }

    /* The "Fake" Loader */
    .chat-loader {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .chat-loader.hidden { opacity: 0; }

    .loader-spinner {
      border: 3px solid rgba(0,0,0,0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 30px; height: 30px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    .loader-text { font-size: 13px; color: var(--text-sub); letter-spacing: 0.5px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* --- RIBOT AI INTERFACE --- */
    .ribot-chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .ribot-input-area {
        min-height: 60px;
        background: var(--header-bg);
        padding: 10px 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid var(--border);
    }

    .ribot-input-field {
        flex: 1;
        padding: 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--sidebar-bg);
        color: var(--text-main);
        outline: none;
        font-family: inherit;
        font-size: 14px;
    }

    .ribot-send-btn {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--ai-color);
        color: white;
        border: none;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: 0.2s;
    }
    .ribot-send-btn:hover { transform: scale(1.05); }

    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot { justify-content: flex-start; }
    
    .msg-bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.4;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        word-wrap: break-word;
    }
    .msg-row.user .msg-bubble {
        background: var(--msg-sent);
        color: var(--text-main);
        border-top-right-radius: 0;
    }
    .msg-row.bot .msg-bubble {
        background: var(--msg-received);
        color: var(--text-main);
        border-top-left-radius: 0;
    }

    /* --- DROPDOWNS & MODALS --- */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 55px; right: 15px;
      background: var(--sidebar-bg);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 6px;
      width: 200px;
      z-index: 100;
      flex-direction: column;
      padding: 6px 0;
      border: 1px solid var(--border);
    }
    .dropdown-menu.show { display: flex; animation: fadeIn 0.1s ease; }
    .dropdown-item {
      padding: 10px 20px; font-size: 14px; color: var(--text-main);
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .dropdown-item:hover { background-color: var(--input-bg); }
    .dropdown-item i { width: 20px; color: var(--text-sub); }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-card {
      background: var(--sidebar-bg);
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      overflow: hidden;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: var(--header-bg);
    }
    .modal-header h3 { margin: 0; font-size: 16px; color: var(--text-main); }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 15px 20px; display: flex; justify-content: flex-end; gap: 10px;
      border-top: 1px solid var(--border);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
    .form-input {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--input-bg); color: var(--text-main); outline: none;
    }
    .form-input:focus { border-color: var(--primary); }

    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: transparent; color: var(--primary); }
    .btn-secondary:hover { background: rgba(0,128,105,0.1); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
  </style>
</head>
<body>

<div class="app-container">
  
  <aside class="sidebar">
    <header>
      <div class="user-profile-section" onclick="openProfileModal()">
        <img src="https://ui-avatars.com/api/?name=Guest&background=008069&color=fff" alt="User" class="user-avatar" id="sidebarAvatar">
        <span class="user-name-display" id="sidebarName">Guest User</span>
      </div>
      <div class="header-icons">
        <i class="fas fa-robot" title="Ribot AI" onclick="loadRibot()" style="color: var(--ai-color);"></i>
        <i class="fas fa-plus-circle" title="New Chat" onclick="openModal('newChatModal')"></i>
        <i class="fas fa-ellipsis-v" title="Menu" id="menuBtn"></i>
      </div>

      <div class="dropdown-menu" id="mainDropdown">
        <div class="dropdown-item" onclick="loadRibot()"><i class="fas fa-robot" style="color:var(--ai-color);"></i> Ask Ribot</div>
        <div class="dropdown-item" onclick="openModal('newChatModal')"><i class="fas fa-comment-medical"></i> New Chat</div>
        <div class="dropdown-item" onclick="openProfileModal()"><i class="fas fa-user-edit"></i> Profile</div>
        <div class="dropdown-item" onclick="toggleTheme()"><i class="fas fa-adjust"></i> Theme</div>
        <div class="dropdown-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt" style="color: #ea0038;"></i> Log out</div>
      </div>
    </header>

    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <i class="fas fa-search" style="color: var(--text-sub);"></i>
        <input type="text" id="searchInput" placeholder="Search or ask Ribot" onkeyup="filterChats()">
      </div>
    </div>

    <div class="chat-list" id="chatList">
        </div>

    <div class="senior-section">
      <div class="senior-header">
        <h4><i class="fas fa-crown"></i> Senior Assist</h4>
        <div class="credit-badge"><i class="fas fa-bolt"></i> <span id="creditDisplay">0</span></div>
      </div>
      <div class="senior-controls">
        <select id="seniorSelect" class="custom-select">
          <option value="" disabled selected>Select Grade</option>
        </select>
        <button class="btn-go" id="askSeniorBtn"><i class="fas fa-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <header>
      <div style="display: flex; align-items: center;">
        <img src="" alt="Room" class="user-avatar" id="roomAvatar" style="margin-right: 15px; background:white;">
        <div style="display:flex; flex-direction:column;">
          <span style="font-weight:600; color:var(--text-main);" id="roomTitle">Select a Chat</span>
          <span style="font-size:12px; color:var(--text-sub);" id="roomSub">...</span>
        </div>
      </div>
      <div class="header-icons">
        <i class="fas fa-search" onclick="showAlert('Press Ctrl+F to find.')"></i>
        <i class="fas fa-ellipsis-v" id="chatMenuBtn"></i>
      </div>

      <div class="dropdown-menu" id="chatDropdown">
        <div class="dropdown-item" onclick="refreshChat()"><i class="fas fa-sync-alt"></i> Refresh</div>
        <div class="dropdown-item" onclick="showAlert('Encrypted via HTTPS')"><i class="fas fa-shield-alt"></i> Security Info</div>
        <div class="dropdown-item" onclick="clearRibotChat()"><i class="fas fa-eraser"></i> Clear AI Chat</div>
      </div>
    </header>

    <div id="iframeContainer" class="view-wrapper">
      <div class="chat-loader" id="chatLoader">
        <div class="loader-spinner"></div>
        <span class="loader-text">Establishing Secure Connection...</span>
      </div>
      <iframe id="chatFrame" src="" allow="camera; microphone; fullscreen"></iframe>
    </div>

    <div id="ribotContainer" class="view-wrapper" style="background: transparent;">
        <div class="ribot-chat-container" id="ribotMessages">
            <div class="msg-row bot">
                <div class="msg-bubble">Hello! I am <strong>Ribot</strong>. Ask me anything! 🤖</div>
            </div>
        </div>
        <div class="ribot-input-area">
            <input type="text" id="ribotInput" class="ribot-input-field" placeholder="Message Ribot..." onkeypress="handleRibotKey(event)">
            <button class="ribot-send-btn" onclick="sendRibotMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

  </main>
</div>

<div id="alertModal" class="modal">
  <div class="modal-card" style="width: 320px; text-align: center;">
    <div class="modal-body">
      <i class="fas fa-info-circle" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
      <p id="alertMsg" style="color: var(--text-main);">Alert</p>
    </div>
    <div class="modal-footer" style="justify-content: center;">
      <button class="btn btn-primary" onclick="closeModals()">Got it</button>
    </div>
  </div>
</div>

<div id="newChatModal" class="modal">
  <div class="modal-card">
    <div class="modal-header"><h3>Create New Room</h3><i class="fas fa-times" onclick="closeModals()"></i></div>
    <div class="modal-body">
      <div class="form-group"><label>Room Name</label><input type="text" id="newChatInput" class="form-input" placeholder="e.g. ScienceProject"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="createCustomChat()">Create</button></div>
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-card">
    <div class="modal-header"><h3>Edit Profile</h3><i class="fas fa-times" onclick="closeModals()"></i></div>
    <div class="modal-body">
      <div class="form-group"><label>Name</label><input type="text" id="profileNameInput" class="form-input"></div>
      <div class="form-group"><label>Class</label><input type="number" id="profileClassInput" class="form-input"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="saveProfile()">Save</button></div>
  </div>
</div>

<script>
  /* --- 1. CORE CONFIG --- */
  const CONFIG = { defaultClass: 5, maxClass: 12, startingCredits: 15 };
  
  let state = {
    user: JSON.parse(localStorage.getItem('risync_user')) || { name: 'Guest User', class: CONFIG.defaultClass },
    credits: parseInt(localStorage.getItem('risync_credits')) || CONFIG.startingCredits,
    theme: localStorage.getItem('risync_theme') || 'light',
    chats: JSON.parse(localStorage.getItem('risync_chats')) || [],
    currentRoom: null
  };

  /* --- 2. INITIALIZATION --- */
  function init() {
    applyTheme(state.theme);
    updateProfileUI();
    updateCreditsUI();
    populateSeniorOptions();
    
    // Ensure Ribot is in chat list
    if (!state.chats.find(c => c.id === 'ribot-ai')) {
        state.chats.unshift({ id: 'ribot-ai', name: 'Ribot AI', type: 'ai', time: Date.now() });
    }
    // Ensure My Class is in list
    const myClassRoom = `risync-class-${state.user.class}`;
    if (!state.chats.find(c => c.id === myClassRoom)) {
        addChatToList(myClassRoom, `Class ${state.user.class} Group`, 'class');
    }

    renderChatList();
    loadRoom(myClassRoom, `Class ${state.user.class} Group`);
  }

  /* --- 3. THEME & UI --- */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('risync_theme', theme);
  }
  function toggleTheme() {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    applyTheme(state.theme);
  }

  /* --- 4. CHAT SWITCHING LOGIC --- */
  function loadRoom(roomId, title, type = 'normal') {
    state.currentRoom = roomId;
    
    // UI Updates
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    const activeItem = document.getElementById(`chat-item-${roomId}`);
    if(activeItem) activeItem.classList.add('active');

    document.getElementById('roomTitle').textContent = title;
    
    // Avatar
    let avBg = '008069';
    if(type === 'senior') avBg = 'f58220';
    if(type === 'ai') avBg = '6c5ce7';
    
    const avUrl = type === 'ai' 
        ? `https://placehold.co/40x40/${avBg}/ffffff?text=AI` 
        : `https://ui-avatars.com/api/?name=${title.replace(' ', '+')}&background=${avBg}&color=fff&rounded=true`;
    document.getElementById('roomAvatar').src = avUrl;

    // SWITCH VIEWS
    const iframeCont = document.getElementById('iframeContainer');
    const ribotCont = document.getElementById('ribotContainer');

    if (type === 'ai') {
        // Show Ribot
        document.getElementById('roomSub').textContent = '';
        iframeCont.classList.remove('active');
        ribotCont.classList.add('active');
    } else {
        // Show Tlk.io
        document.getElementById('roomSub').textContent = type === 'senior' ? 'Priority Support' : 'Secure Channel';
        ribotCont.classList.remove('active');
        iframeCont.classList.add('active');
        
        // Iframe Logic
        const iframe = document.getElementById('chatFrame');
        const loader = document.getElementById('chatLoader');
        loader.classList.remove('hidden');
        iframe.classList.remove('loaded');
        const nickname = state.user.name.split(' ')[0];
        iframe.src = `https://tlk.io/${roomId}?nickname=${encodeURIComponent(nickname)}&theme=minimal`;
        iframe.onload = () => { setTimeout(() => { loader.classList.add('hidden'); iframe.classList.add('loaded'); }, 800); };
    }
  }

  function addChatToList(id, name, type) {
    // Avoid dupe pushing if already exists (except specifically updating time)
    if(!state.chats.find(c => c.id === id)) {
      state.chats.push({ id, name, type, time: Date.now() });
      localStorage.setItem('risync_chats', JSON.stringify(state.chats));
    }
    renderChatList();
  }

  function renderChatList() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    // Sort: AI first, then by time
    const sorted = state.chats.sort((a,b) => (a.type==='ai' ? -1 : 1));

    sorted.forEach(chat => {
      let color = '00a884';
      let subMsg = 'Tap to chat...';
      if(chat.type === 'senior') color = 'f58220';
      if(chat.type === 'ai') { color = '6c5ce7'; subMsg = 'Ask me anything...'; }

      const div = document.createElement('div');
      div.className = 'chat-item';
      div.id = `chat-item-${chat.id}`;
      div.onclick = () => loadRoom(chat.id, chat.name, chat.type);
      
      const avUrl = chat.type === 'ai' 
        ? `https://placehold.co/48x48/${color}/ffffff?text=AI`
        : `https://ui-avatars.com/api/?name=${encodeURIComponent(chat.name)}&background=${color}&color=fff`;

      div.innerHTML = `
        <img src="${avUrl}" alt="icon">
        <div class="chat-info">
          <div class="chat-top"><span class="chat-name">${chat.name}</span></div>
          <div class="chat-msg">${subMsg}</div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  /* --- 5. RIBOT AI LOGIC --- */
  function loadRibot() {
      if(!state.chats.find(c => c.id === 'ribot-ai')) {
          addChatToList('ribot-ai', 'Ribot AI', 'ai');
      }
      loadRoom('ribot-ai', 'Ribot AI', 'ai');
  }

  function handleRibotKey(e) {
      if(e.key === 'Enter') sendRibotMessage();
  }

  async function sendRibotMessage() {
      const input = document.getElementById('ribotInput');
      const text = input.value.trim();
      if(!text) return;

      // 1. Add User Msg
      appendRibotBubble(text, 'user');
      input.value = '';
      
      // 2. Loading Bubble
      const loadingId = 'loading-' + Date.now();
      appendRibotBubble('Thinking...', 'bot', loadingId);

      // 3. Fetch Pollinations
      try {
          // Pollinations Text API: GET https://text.pollinations.ai/{prompt}
          const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
          if(!response.ok) throw new Error("AI Busy");
          const reply = await response.text();
          
          // 4. Update Bubble
          const bubble = document.getElementById(loadingId);
          if(bubble) bubble.innerHTML = formatAIResponse(reply);

      } catch (err) {
          const bubble = document.getElementById(loadingId);
          if(bubble) bubble.textContent = "Sorry, my brain is offline. Try again later.";
      }
  }

  function appendRibotBubble(text, sender, id = null) {
      const container = document.getElementById('ribotMessages');
      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      if(id) bubble.id = id;
      bubble.textContent = text;
      
      row.appendChild(bubble);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
  }

  function formatAIResponse(text) {
      // Basic formatting for nice look
      return text.replace(/\n/g, '<br>');
  }

  function clearRibotChat() {
      document.getElementById('ribotMessages').innerHTML = 
        '<div class="msg-row bot"><div class="msg-bubble">Chat cleared. Ready for new questions! 🤖</div></div>';
  }

  /* --- 6. UTILITIES (Modals, etc.) --- */
  window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; }
  window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
  window.showAlert = (msg) => { document.getElementById('alertMsg').textContent = msg; openModal('alertModal'); }

  const menuBtn = document.getElementById('menuBtn');
  const mainDropdown = document.getElementById('mainDropdown');
  const chatMenuBtn = document.getElementById('chatMenuBtn');
  const chatDropdown = document.getElementById('chatDropdown');

  window.addEventListener('click', (e) => {
    if(e.target === menuBtn) mainDropdown.classList.toggle('show');
    else mainDropdown.classList.remove('show');
    if(e.target === chatMenuBtn) chatDropdown.classList.toggle('show');
    else chatDropdown.classList.remove('show');
  });

  /* --- 7. SENIOR & PROFILE LOGIC --- */
  function populateSeniorOptions() {
    const select = document.getElementById('seniorSelect');
    select.innerHTML = '<option value="" disabled selected>Select Grade</option>';
    const currentClass = parseInt(state.user.class);
    if (currentClass >= CONFIG.maxClass) {
       select.innerHTML += '<option value="alumni">Alumni Network</option>';
    } else {
      for(let i = currentClass + 1; i <= CONFIG.maxClass; i++) {
        select.innerHTML += `<option value="${i}">Class ${i}</option>`;
      }
    }
  }

  document.getElementById('askSeniorBtn').addEventListener('click', () => {
    const grade = document.getElementById('seniorSelect').value;
    if (!grade) return showAlert("Please select a grade.");
    if (state.credits > 0) {
      state.credits--;
      updateCreditsUI();
      const id = `risync-senior-${grade}`;
      const name = grade === 'alumni' ? "Alumni Mentors" : `Class ${grade} Help`;
      addChatToList(id, name, 'senior');
      loadRoom(id, name, 'senior');
    } else { showAlert("No credits left!"); }
  });

  function saveProfile() {
      const name = document.getElementById('profileNameInput').value;
      const cls = document.getElementById('profileClassInput').value;
      if(name && cls) {
          state.user = { name, class: cls };
          localStorage.setItem('risync_user', JSON.stringify(state.user));
          location.reload();
      }
  }
  function updateProfileUI() {
      document.getElementById('sidebarName').textContent = state.user.name;
      document.getElementById('sidebarAvatar').src = `https://ui-avatars.com/api/?name=${state.user.name.replace(' ', '+')}&background=008069&color=fff`;
      document.getElementById('profileNameInput').value = state.user.name;
      document.getElementById('profileClassInput').value = state.user.class;
  }
  function updateCreditsUI() {
      document.getElementById('creditDisplay').textContent = state.credits;
      localStorage.setItem('risync_credits', state.credits);
  }
  function createCustomChat() {
      const name = document.getElementById('newChatInput').value.trim();
      if(name) {
          const id = `risync-${name.replace(/\s+/g, '-').toLowerCase()}`;
          addChatToList(id, name, 'custom');
          loadRoom(id, name, 'custom');
          closeModals();
      }
  }

  init();
</script>
</body>
</html>
