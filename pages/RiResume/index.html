<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Resume Builder</title>
    <style>
        :root {
            --primary: #2c3e50; /* Sidebar Color */
            --secondary: #34495e;
            --accent: #1abc9c; /* Highlight Color */
            --text-dark: #333;
            --text-light: #ecf0f1;
            --bg-app: #eef2f3;
            --border: #ddd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-app); height: 100vh; overflow: hidden; }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100vh; }

        /* --- LEFT EDITOR --- */
        .editor {
            width: 35%;
            background: #fff;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            z-index: 10;
        }
        
        .editor h2 { color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--secondary); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.9rem; transition: 0.3s; background: #f9f9f9;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); background: #fff; outline: none; }
        .form-group textarea { height: 80px; resize: vertical; }

        .section-header { 
            margin-top: 25px; margin-bottom: 15px; display: flex; 
            justify-content: space-between; align-items: center;
            border-top: 1px solid #eee; padding-top: 15px;
        }
        .section-header h3 { font-size: 1rem; color: var(--primary); }
        
        .btn {
            padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: 0.2s;
        }
        .btn-add { background: #e0f2f1; color: #00695c; }
        .btn-add:hover { background: #b2dfdb; }
        
        .btn-remove { background: #ffebee; color: #c62828; font-size: 0.75rem; position: absolute; top: 10px; right: 10px; }
        
        .dynamic-item { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 10px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }

        .btn-print {
            width: 100%; background: var(--accent); color: white; padding: 15px;
            font-size: 1rem; margin-top: 20px; border-radius: 6px;
        }
        .btn-print:hover { background: #16a085; }

        /* --- RIGHT PREVIEW --- */
        .preview-pane {
            width: 65%; background: var(--bg-app); padding: 40px;
            overflow-y: auto; display: flex; justify-content: center;
        }

        /* --- RESUME DESIGN --- */
        .resume {
            width: 210mm; min-height: 297mm; background: white;
            display: grid; grid-template-columns: 30% 70%;
            box-shadow: 0 0 25px rgba(0,0,0,0.1);
        }

        /* Sidebar (Left) */
        .resume-left {
            background: var(--primary); color: var(--text-light);
            padding: 30px 20px; text-align: center;
        }

        /* Photo Styling */
        .photo-container {
            width: 140px; height: 140px; margin: 0 auto 20px auto;
            border-radius: 50%; border: 4px solid rgba(255,255,255,0.2);
            overflow: hidden; background: #1a252f; display: flex; align-items: center; justify-content: center;
        }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .photo-placeholder { font-size: 3rem; color: rgba(255,255,255,0.2); }

        .left-section { margin-bottom: 30px; text-align: left; }
        .left-title {
            font-size: 1rem; text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px;
            margin-bottom: 15px; color: var(--accent); font-weight: bold;
        }

        .contact-item { font-size: 0.85rem; margin-bottom: 10px; word-break: break-all; display: flex; align-items: center; gap: 10px;}
        .contact-icon { width: 20px; text-align: center; font-size: 1rem; }

        .skill-tag {
            display: inline-block; background: rgba(255,255,255,0.1);
            padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;
            margin: 0 5px 5px 0;
        }

        .edu-item { margin-bottom: 15px; }
        .edu-degree { font-weight: bold; font-size: 0.9rem; color: white; }
        .edu-school { font-size: 0.85rem; color: #bdc3c7; }
        .edu-date { font-size: 0.8rem; color: #95a5a6; font-style: italic; }

        /* Main Content (Right) */
        .resume-right { padding: 40px; color: var(--text-dark); }

        .header-name { font-size: 2.8rem; font-weight: 700; line-height: 1.2; color: var(--primary); text-transform: uppercase; }
        .header-role { font-size: 1.3rem; color: var(--accent); font-weight: 500; margin-bottom: 20px; }

        .right-section { margin-bottom: 30px; }
        .right-title {
            font-size: 1.2rem; font-weight: bold; color: var(--primary);
            border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .summary-text { font-size: 0.95rem; line-height: 1.6; color: #555; }

        .exp-item { margin-bottom: 20px; }
        .exp-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .exp-role { font-weight: bold; font-size: 1.1rem; color: #2c3e50; }
        .exp-company { font-weight: 600; color: var(--accent); font-size: 0.95rem; }
        .exp-date { font-size: 0.85rem; color: #7f8c8d; min-width: 100px; text-align: right; }
        .exp-desc { font-size: 0.9rem; color: #555; margin-top: 5px; line-height: 1.5; }

        /* --- PRINT STYLES --- */
        @media print {
            body { height: auto; overflow: visible; background: white; }
            .editor { display: none; }
            .preview-pane { width: 100%; padding: 0; display: block; }
            .resume { 
                box-shadow: none; margin: 0; width: 100%; 
                /* Ensures background colors print correctly */
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            @page { margin: 0; } /* Removes browser default margins */
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="editor">
        <h2>Resume Editor</h2>

        <div class="form-group">
            <label>Profile Photo</label>
            <input type="file" accept="image/*" onchange="loadPhoto(event)">
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="in-name" placeholder="Jane Doe" oninput="update()">
        </div>
        <div class="form-group">
            <label>Current Job Title</label>
            <input type="text" id="in-title" placeholder="Creative Director" oninput="update()">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="text" id="in-email" placeholder="jane@email.com" oninput="update()">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="in-phone" placeholder="+1 555 000 000" oninput="update()">
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" id="in-loc" placeholder="New York, USA" oninput="update()">
        </div>
        
        <div class="section-header">
            <h3>Education</h3>
            <button class="btn btn-add" onclick="addEdu()">+ Add</button>
        </div>
        <div id="edu-container"></div>

        <div class="section-header">
            <h3>Skills</h3>
        </div>
        <div class="form-group">
            <textarea id="in-skills" placeholder="Leadership, Photoshop, Public Speaking..." oninput="update()"></textarea>
        </div>

        <div class="section-header">
            <h3>Professional Summary</h3>
        </div>
        <div class="form-group">
            <textarea id="in-summary" placeholder="A brief overview of your career..." oninput="update()"></textarea>
        </div>

        <div class="section-header">
            <h3>Work Experience</h3>
            <button class="btn btn-add" onclick="addExp()">+ Add</button>
        </div>
        <div id="exp-container"></div>

        <button class="btn btn-print" onclick="window.print()">Download PDF</button>
    </div>

    <div class="preview-pane">
        <div class="resume">
            
            <div class="resume-left">
                <div class="photo-container">
                    <span class="photo-placeholder" id="photo-placeholder">👤</span>
                    <img id="resume-photo" src="" alt="Profile">
                </div>

                <div class="left-section">
                    <div class="left-title">Contact</div>
                    <div class="contact-item">
                        <span class="contact-icon">✉</span> <span id="out-email">jane@email.com</span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">📞</span> <span id="out-phone">+1 555 000 000</span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">📍</span> <span id="out-loc">New York, USA</span>
                    </div>
                </div>

                <div class="left-section">
                    <div class="left-title">Education</div>
                    <div id="out-edu-list">
                        </div>
                </div>

                <div class="left-section">
                    <div class="left-title">Skills</div>
                    <div id="out-skills-list">
                        </div>
                </div>
            </div>

            <div class="resume-right">
                <div class="header-name" id="out-name">Jane Doe</div>
                <div class="header-role" id="out-title">Creative Director</div>

                <div class="right-section">
                    <div class="right-title">Profile</div>
                    <div class="summary-text" id="out-summary">
                        Experienced Creative Director with a demonstrated history of working in the design industry...
                    </div>
                </div>

                <div class="right-section">
                    <div class="right-title">Experience</div>
                    <div id="out-exp-list">
                        </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
    // 1. Photo Upload Logic
    function loadPhoto(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const img = document.getElementById('resume-photo');
            const placeholder = document.getElementById('photo-placeholder');
            img.src = reader.result;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // 2. Dynamic Fields Handling
    function addEdu() {
        const id = Date.now();
        const div = document.createElement('div');
        div.className = 'dynamic-item';
        div.id = 'edu-' + id;
        div.innerHTML = `
            <button class="btn btn-remove" onclick="remove('edu-${id}')">Remove</button>
            <div class="form-group"><input type="text" class="edu-in-degree" placeholder="Degree" oninput="update()"></div>
            <div class="form-group"><input type="text" class="edu-in-school" placeholder="University" oninput="update()"></div>
            <div class="form-group"><input type="text" class="edu-in-year" placeholder="Year" oninput="update()"></div>
        `;
        document.getElementById('edu-container').appendChild(div);
    }

    function addExp() {
        const id = Date.now();
        const div = document.createElement('div');
        div.className = 'dynamic-item';
        div.id = 'exp-' + id;
        div.innerHTML = `
            <button class="btn btn-remove" onclick="remove('exp-${id}')">Remove</button>
            <div class="form-group"><input type="text" class="exp-in-role" placeholder="Job Title" oninput="update()"></div>
            <div class="form-group"><input type="text" class="exp-in-comp" placeholder="Company" oninput="update()"></div>
            <div class="form-group"><input type="text" class="exp-in-date" placeholder="Date Range" oninput="update()"></div>
            <div class="form-group"><textarea class="exp-in-desc" placeholder="Details..." oninput="update()"></textarea></div>
        `;
        document.getElementById('exp-container').appendChild(div);
    }

    function remove(id) {
        document.getElementById(id).remove();
        update();
    }

    // 3. Main Update Logic
    function update() {
        // Basic Info
        document.getElementById('out-name').innerText = document.getElementById('in-name').value || 'Jane Doe';
        document.getElementById('out-title').innerText = document.getElementById('in-title').value || 'Creative Director';
        document.getElementById('out-email').innerText = document.getElementById('in-email').value || 'jane@email.com';
        document.getElementById('out-phone').innerText = document.getElementById('in-phone').value || '+1 555 000 000';
        document.getElementById('out-loc').innerText = document.getElementById('in-loc').value || 'City, Country';
        document.getElementById('out-summary').innerText = document.getElementById('in-summary').value || 'Professional summary goes here...';

        // Education Loop
        const eduList = document.getElementById('out-edu-list');
        eduList.innerHTML = '';
        document.querySelectorAll('#edu-container .dynamic-item').forEach(item => {
            const deg = item.querySelector('.edu-in-degree').value;
            const sch = item.querySelector('.edu-in-school').value;
            const yr = item.querySelector('.edu-in-year').value;
            if(deg || sch) {
                eduList.innerHTML += `
                    <div class="edu-item">
                        <div class="edu-degree">${deg}</div>
                        <div class="edu-school">${sch}</div>
                        <div class="edu-date">${yr}</div>
                    </div>`;
            }
        });

        // Experience Loop
        const expList = document.getElementById('out-exp-list');
        expList.innerHTML = '';
        document.querySelectorAll('#exp-container .dynamic-item').forEach(item => {
            const role = item.querySelector('.exp-in-role').value;
            const comp = item.querySelector('.exp-in-comp').value;
            const date = item.querySelector('.exp-in-date').value;
            const desc = item.querySelector('.exp-in-desc').value;
            if(role || comp) {
                expList.innerHTML += `
                    <div class="exp-item">
                        <div class="exp-header">
                            <div>
                                <span class="exp-role">${role}</span>
                                <br>
                                <span class="exp-company">${comp}</span>
                            </div>
                            <span class="exp-date">${date}</span>
                        </div>
                        <div class="exp-desc">${desc.replace(/\n/g, '<br>')}</div>
                    </div>`;
            }
        });

        // Skills Loop
        const skillInput = document.getElementById('in-skills').value;
        const skillContainer = document.getElementById('out-skills-list');
        skillContainer.innerHTML = '';
        if(skillInput) {
            skillInput.split(',').forEach(skill => {
                if(skill.trim()) {
                    skillContainer.innerHTML += `<span class="skill-tag">${skill.trim()}</span>`;
                }
            });
        }
    }

    // Initialize
    window.onload = () => {
        addEdu();
        addExp();
        update();
    }
</script>

</body>
</html>
