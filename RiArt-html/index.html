	<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Demo</title>
    <style>
        /* CSS Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* The Container for the Full Screen Image */
        .hero-section {
            /* Replace 'RiArt-html.png' with your actual file path if different */
            background-image: url('RiArt-html.png'); 
            
            /* Ensures image covers the whole screen */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; 
            
            height: 100vh;
            width: 100vw;
            
            /* Flexbox to center the button */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Optional: Adds a slight dark tint so the button pops (remove if not wanted) */
            background-color: rgba(0, 0, 0, 0.1); 
            background-blend-mode: overlay;
        }

        /* Button Styling */
        .connect-btn {
            text-decoration: none;
            background-color: #0077b5; /* LinkedIn Blue */
            color: white;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            opacity: 0; /* Hidden initially for JS animation */
            transform: translateY(20px); /* Pushed down initially */
            border: 2px solid transparent;
            cursor: pointer;
        }

        /* Button Hover Effects */
        .connect-btn:hover {
            background-color: #005582;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .connect-btn:active {
            transform: translateY(1px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .connect-btn {
                padding: 15px 30px;
                font-size: 1rem;
                width: 80%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <a href="https://risync.in/#contact" target="_blank" class="connect-btn" id="mainButton">
            Book A Demo
        </a>
    </div>

    <script>
        // JavaScript for Animation
        document.addEventListener("DOMContentLoaded", function() {
            const button = document.getElementById('mainButton');
            
            // Simple fade-in and slide-up animation
            setTimeout(() => {
                button.style.opacity = "1";
                button.style.transform = "translateY(0)";
            }, 300); // 300ms delay after load
            
            // Optional: Log to console to confirm JS is running
            console.log("Page loaded. Connect button ready.");
        });
    </script>

</body>
</html>
